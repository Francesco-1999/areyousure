<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Are You Sure?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;600&family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Onest:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: una scrivania di sera. Monitor (un OS calmo che diventa ostile) sopra, scrivania con telefono, tazza e post-it sotto. Un solo mondo visivo, voluto. */
:root{
  --wall:#1a2321; --wall-hi:#2d3d39; --wood:#6e4831; --wood-dk:#45291b; --bezel:#141615;
  --ink:#1d2321; --muted:#5d6864; --paper:#fbfaf6; --chrome:#eceee9; --line:#d5d9d3;
  --accent:#1f6b64; --accent-soft:#dcece8; --danger:#cf3a2d; --danger-soft:#fde5e1;
  --gold:#e2a52e; --ok:#2e8550; --hint:#fff4c2;
  --f-ui:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-disp:'Bricolage Grotesque','Onest',system-ui,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --f-news:'Newsreader',Georgia,'Times New Roman',serif;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--ink);font-family:var(--f-ui);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
[data-x]{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
*{box-sizing:border-box}
img{display:block;max-width:100%}

/* ---------- INTRO ---------- */
#intro{position:fixed;inset:0;z-index:200;background:#0e0d12;color:#f4efe6;overflow:hidden;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}
.gate{position:absolute;inset:0;display:grid;place-items:center;padding:16px}
.gdlg{width:min(360px,100%);background:#f4f3ee;color:#1d2321;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px #000c;animation:popIn .5s cubic-bezier(.2,1.5,.4,1)}
.gdlg .gt{background:#e3e5df;padding:8px 12px;font:600 12px var(--f-ui);color:#4b5551}
.gdlg p{margin:0;padding:18px 18px 8px;font-size:14px;line-height:1.5}
.gdlg .gb{display:flex;gap:8px;justify-content:flex-end;padding:12px 14px 14px}
.gdlg .gb button{padding:8px 16px;border-radius:7px;font-weight:600;font-size:13px;background:#d9dcd6}
.gdlg .gb button:last-child{background:var(--accent);color:#fff}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
.istage{position:absolute;inset:0}
.idlg{position:absolute;width:190px;background:#f4f3ee;color:#1d2321;border-radius:8px;box-shadow:0 14px 40px #000a;font-size:12px;overflow:hidden;animation:popIn .28s cubic-bezier(.2,1.6,.4,1) both;transition:transform .7s cubic-bezier(.6,0,.4,1),opacity .7s}
.idlg .t{background:#dfe1db;padding:4px 8px;font-size:10px;font-weight:600;color:#59625e}
.idlg .m{padding:10px 10px 4px;font-weight:700}
.idlg .b{display:flex;gap:6px;justify-content:flex-end;padding:6px 8px 9px}
.idlg .b span{padding:3px 10px;border-radius:5px;background:#cf3a2d;color:#fff;font-weight:700;font-size:11px}
.idlg .b span+span{background:none;color:#9aa19e;font-weight:500;font-size:9px;padding:3px 2px}
.ititle{position:absolute;left:0;right:0;top:50%;transform:translateY(-62%);text-align:center;margin:0;font:800 clamp(52px,12vw,168px)/.9 var(--f-disp);letter-spacing:-.045em;white-space:nowrap}
.ititle span{display:inline-block;animation:drop .7s cubic-bezier(.25,1.6,.45,1) both;animation-delay:calc(var(--i)*70ms);text-shadow:3px 0 0 #cf3a2d99,-3px 0 0 #3fd3c299}
.ititle .sp{width:.25em}
.ititle .q{color:#ff5a47;animation:drop .7s cubic-bezier(.25,1.6,.45,1) both,wob 1.6s 1.4s ease-in-out infinite;animation-delay:calc(var(--i)*70ms),1.6s;transform-origin:50% 90%}
@keyframes drop{from{transform:translateY(-140px) rotate(-12deg);opacity:0}}
@keyframes wob{0%,100%{rotate:0}30%{rotate:14deg}60%{rotate:-8deg}}
.isub{position:absolute;left:16px;right:16px;top:calc(50% + clamp(36px,7vw,96px));text-align:center;font:500 clamp(14px,1.8vw,18px)/1.4 var(--f-ui);color:#bdb6aa;opacity:0;transition:opacity .6s,transform .6s;transform:translateY(10px)}
.isub.on{opacity:1;transform:none}
.ibtns{position:absolute;left:0;right:0;top:calc(50% + clamp(84px,12vw,150px));display:flex;justify-content:center;align-items:center;gap:18px;opacity:0;transition:opacity .5s}
.ibtns.on{opacity:1}
.ibtns .go{padding:14px 34px;border-radius:99px;background:#ff5a47;color:#fff;font:700 17px var(--f-ui);box-shadow:0 10px 40px -8px #ff5a47aa;transition:transform .15s}
.ibtns .go:hover{transform:scale(1.06)}
.ibtns .no{font-size:12px;color:#7c766c;text-decoration:underline;transition:transform .25s}
.iring{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px;border-radius:50%;border:2px solid #ff5a4766;animation:ring 1.8s ease-out forwards}
@keyframes ring{to{transform:scale(80);opacity:0}}
.iver{position:absolute;right:16px;bottom:14px;z-index:2;font:600 11px var(--f-mono);color:#8a8478;letter-spacing:.12em;pointer-events:none}
.iskip{position:absolute;left:16px;bottom:14px;font:500 11px var(--f-mono);color:#6d685f;letter-spacing:.08em}
.iflash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.iflash.on{animation:ifl .5s}
@keyframes ifl{10%{opacity:.85}100%{opacity:0}}

/* ---------- STANZA ---------- */
#room{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;padding:14px 16px 0;
  background:radial-gradient(70% 55% at 50% 0%,var(--wall-hi) 0%,var(--wall) 70%)}
#monitor{position:relative;flex:1;min-height:0;width:100%;max-width:1440px;background:var(--bezel);border-radius:16px;padding:11px 11px 24px;
  box-shadow:0 0 0 1px #2a2d2b inset,0 30px 60px -20px #000c,0 0 120px -30px #9fc7bd55;transition:transform .6s,opacity .6s}
#monitor .brand{position:absolute;bottom:5px;left:0;right:0;text-align:center;font:600 9px/1 var(--f-mono);letter-spacing:.3em;color:#4b504d;text-transform:uppercase;pointer-events:none}
#monitor .led{position:absolute;bottom:9px;right:18px;width:5px;height:5px;border-radius:50%;background:#59d38b;box-shadow:0 0 6px #59d38b}
#screen{position:relative;width:100%;height:100%;overflow:hidden;border-radius:5px;background:#0c0f0e}
#neck{width:90px;height:16px;flex:none;background:linear-gradient(#2a2d2c,#1a1c1b)}
#desk{position:relative;width:calc(100% + 32px);height:96px;flex:none;
  background:linear-gradient(180deg,#80553a 0,var(--wood) 14%,var(--wood-dk) 100%);box-shadow:0 -1px 0 #9a6a49 inset}
#desk::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#0000 0 140px,#0000000d 140px 142px,#0000 142px 260px);pointer-events:none}
.sticky{position:absolute;left:max(16px,calc(50% - 560px));top:8px;width:184px;min-height:70px;padding:8px 10px 10px;background:#f3df7a;color:#3b3214;text-align:left;
  transform:rotate(-2.5deg);box-shadow:0 6px 10px -4px #0008;font:500 11.5px/1.35 var(--f-ui);transition:transform .2s}
.sticky:hover{transform:rotate(-1deg) scale(1.04)}
.sticky b{display:block;font:700 9px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px;color:#7a6512}
.sticky.flash{animation:stk .5s 3}
@keyframes stk{50%{background:#fff3a8;transform:rotate(-2.5deg) scale(1.08)}}
.mug{position:absolute;left:max(260px,calc(50% - 200px));bottom:18px;width:46px;height:52px;transition:transform .45s cubic-bezier(.3,1.6,.5,1)}
.mug .cup{position:absolute;inset:0 6px 0 0;background:linear-gradient(90deg,#e9e4da,#fffdf8 45%,#cfc8bb);border-radius:4px 4px 12px 12px;box-shadow:0 8px 8px -4px #0007}
.mug .cup::after{content:"";position:absolute;left:8px;right:8px;top:14px;height:14px;border-radius:2px;background:var(--accent);opacity:.8}
.mug .handle{position:absolute;right:-6px;top:10px;width:18px;height:24px;border:5px solid #e3ded3;border-left:0;border-radius:0 12px 12px 0}
.mug .steam{position:absolute;left:12px;top:-22px;width:18px;height:20px;border-left:2px solid #ffffff44;border-radius:50%;animation:steam 3s infinite}
@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
.mug.hot{animation:wiggle .5s 3}
.mug.lift{transform:translateY(-60px) rotate(-8deg)}
@keyframes wiggle{0%,100%{rotate:0}25%{rotate:-6deg}75%{rotate:6deg}}
.plant{position:absolute;left:max(206px,calc(50% - 300px));bottom:16px;width:40px;height:62px}
.plant .pot{position:absolute;bottom:0;left:6px;width:28px;height:24px;background:#b0623f;border-radius:2px 2px 8px 8px}
.plant i{position:absolute;bottom:20px;left:18px;width:12px;height:30px;background:#4f8a55;border-radius:50% 50% 50% 50%/80% 80% 20% 20%;transform-origin:bottom center;transition:rotate .3s}
.plant i:nth-child(2){transform:rotate(-35deg)}.plant i:nth-child(3){transform:rotate(35deg);background:#3f7748}
.plant:hover i{rotate:6deg}
.phone{position:absolute;right:max(16px,calc(50% - 340px));bottom:12px;width:50px;height:88px;border-radius:10px;background:#151716;padding:4px;transform:rotate(9deg);box-shadow:0 8px 10px -4px #000a;transition:transform .2s}
.phone:hover{transform:rotate(4deg) translateY(-4px)}
.phone .ps{position:relative;width:100%;height:100%;border-radius:7px;background:#0b0c0c;transition:background .3s,box-shadow .3s;display:grid;place-items:center}
.phone .ps b{font:700 13px var(--f-mono);color:#fff;opacity:0}
.phone.lit{animation:buzz .3s 8}
.phone.lit .ps{background:linear-gradient(#2a7b73,#16403c);box-shadow:0 0 24px #4fd1c1aa}
.phone.lit .ps b{opacity:1}
@keyframes buzz{0%,100%{translate:0}25%{translate:-2px 0}75%{translate:2px 0}}
.mug,.plant{cursor:pointer}

/* ---------- LOCK ---------- */
.wall{background:
  radial-gradient(circle at 76% 28%,#f8e7b9 0 5%,#f8e7b900 5.5%),
  radial-gradient(130% 55% at 15% 104%,#7f9c7e 0 46%,#7f9c7e00 46.5%),
  radial-gradient(110% 50% at 85% 106%,#5f8166 0 50%,#5f816600 50.5%),
  radial-gradient(160% 45% at 50% 115%,#47664f 0 52%,#47664f00 52.5%),
  linear-gradient(180deg,#c7d6cf 0%,#e6dcc7 70%,#efd9b8 100%)}
#lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;z-index:30;transition:opacity .6s,transform .6s;padding:16px}
#lock::before{content:"";position:absolute;inset:0;backdrop-filter:blur(14px);background:#1d2b2655}
#lock>*{position:relative}
#lock .lk-time{font:700 clamp(54px,11vw,120px)/1 var(--f-disp);letter-spacing:-.03em}
#lock .lk-date{font:500 15px/1 var(--f-ui);opacity:.9;margin-bottom:22px;text-transform:capitalize}
#lock .lk-av{width:68px;height:68px;border-radius:50%;background:#f1e2c6;color:#3d4a43;display:grid;place-items:center;font:700 28px var(--f-disp);transition:transform .2s}
#lock .lk-av.pop{transform:scale(1.12)}
#lock .lk-q{font:600 14px var(--f-ui)}
#lock input{width:min(260px,100%);padding:11px 16px;border-radius:99px;border:1px solid #ffffff66;background:#ffffff26;color:#fff;font:600 15px var(--f-ui);text-align:center;backdrop-filter:blur(6px)}
#lock input::placeholder{color:#ffffffaa}
#lock input.bad{animation:shake .38s;border-color:#ff8a7a}
#lock .lk-go{margin-top:4px;padding:10px 26px;border-radius:99px;background:#ffffff;color:#1d2b26;font-weight:700}
#lock .lk-go:hover{background:#f1e2c6}
#lock .lk-note{font-size:12px;opacity:.75;margin-top:10px;max-width:40ch;text-align:center}
#lock.gone{opacity:0;transform:scale(1.04);pointer-events:none}

/* ---------- OS ---------- */
#os{position:absolute;inset:0;display:flex;flex-direction:column}
#menubar{position:relative;height:30px;flex:none;display:flex;align-items:center;gap:12px;padding:0 10px;background:#f7f7f3d9;backdrop-filter:blur(10px);border-bottom:1px solid #0000001a;font-size:12.5px;z-index:9;white-space:nowrap}
#menubar .mb-logo{font:800 13px var(--f-disp);letter-spacing:-.01em;display:flex;align-items:center;gap:6px}
#menubar .mb-logo i{width:12px;height:12px;border-radius:50%;background:conic-gradient(var(--accent) 0 50%,#e6c56f 0)}
#menubar .mb-app{font-weight:600}
#menubar .mb-menu{color:#4b5551;padding:3px 6px;border-radius:5px}
#menubar .mb-menu:hover,#menubar .mb-menu.on{background:#0000000f}
.mb-dd{position:absolute;top:28px;z-index:20;min-width:200px;background:#fbfaf6f5;backdrop-filter:blur(12px);border-radius:8px;padding:5px;box-shadow:0 12px 30px -8px #0006,0 0 0 1px #0000001c;display:flex;flex-direction:column}
.mb-dd button{text-align:left;padding:6px 10px;border-radius:5px;font-size:12.5px;display:flex;justify-content:space-between;gap:16px}
.mb-dd button:hover{background:var(--accent);color:#fff}
.mb-dd small{opacity:.55}
#menubar .mb-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.hud-lv{font:600 11px var(--f-mono);color:var(--muted);letter-spacing:.04em}
.hud-time{display:flex;align-items:center;gap:4px;font:600 12px var(--f-mono);padding:2px 7px;border-radius:5px;background:#00000010;font-variant-numeric:tabular-nums}
.hud-time.low{background:var(--danger);color:#fff;animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.65}}
.hud-pat{display:flex;align-items:center;gap:6px;font-weight:600}
.hud-pat .pb{width:74px;height:9px;border-radius:5px;background:#00000018;overflow:hidden;box-shadow:0 0 0 1px #0000001f inset}
.hud-pat .pb i{display:block;height:100%;width:100%;background:var(--ok);border-radius:5px;transition:width .4s,background .4s}
.hud-pat b{font:600 11px var(--f-mono);min-width:3ch;text-align:right;font-variant-numeric:tabular-nums}
.hud-spend{font:600 12px var(--f-mono);padding:2px 7px;border-radius:5px;background:#00000010;font-variant-numeric:tabular-nums}
.hud-spend.hit{background:var(--danger);color:#fff}
.hint-btn{display:flex;align-items:center;gap:5px;padding:2px 9px 2px 6px;border-radius:99px;background:var(--hint);color:#5a4a0c;font-weight:600;font-size:12px;box-shadow:0 0 0 1px #e2c55a inset}
.hint-btn:hover{background:#ffe98a}
#mute{display:grid;place-items:center;width:22px;height:22px;border-radius:5px}
#mute:hover{background:#0000000f}
#clock{font-variant-numeric:tabular-nums;font-weight:500}
@media (max-width:860px){#menubar .mb-menu,#menubar .hud-lv,#clock,.hint-btn span{display:none}#menubar{gap:7px}.hud-pat .pb{width:44px}.hud-pat>span:first-child{display:none}}

#desktop{position:relative;flex:1;min-height:0;overflow:hidden}
#wins{position:absolute;inset:0;z-index:4;pointer-events:none}
.dicons{position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:14px;z-index:1}
.dicon{width:76px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#fff;text-shadow:0 1px 3px #0009;padding:4px;border-radius:6px}
.dicon:hover{background:#ffffff26}
.dicon .ico{width:44px;height:44px}

.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--paper);border-radius:10px;overflow:hidden;
  box-shadow:0 0 0 1px #0000002b,0 18px 50px -12px #0007,0 4px 12px -4px #0003;animation:winIn .22s ease-out}
@keyframes winIn{from{opacity:0;transform:scale(.97) translateY(6px)}}
.tbar{height:32px;flex:none;display:flex;align-items:center;padding:0 6px 0 12px;background:var(--chrome);border-bottom:1px solid var(--line);cursor:grab;touch-action:none;user-select:none}
.tbar:active{cursor:grabbing}
.tbar .ttl{font-size:12.5px;font-weight:600;color:#3b4441;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wctl{display:flex;gap:2px}
.wctl button{width:28px;height:22px;border-radius:5px;display:grid;place-items:center;color:#4b5551}
.wctl button:hover{background:#0000000f}
.wctl .w-close:hover{background:var(--danger);color:#fff}
.wbody{flex:1;min-height:0;overflow:auto;position:relative}

.bchrome{background:var(--chrome);border-bottom:1px solid var(--line);padding:6px 8px 7px;display:flex;align-items:center;gap:4px}
.bchrome .nav{width:26px;height:26px;border-radius:6px;color:#606a66;display:grid;place-items:center;font-size:16px}
.bchrome .nav:hover{background:#0000000d}
.url{flex:1;min-width:0;height:28px;border-radius:7px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:0 10px;font-size:12.5px;color:#46504c;overflow:hidden;white-space:nowrap;text-align:left}
.url .u{overflow:hidden;text-overflow:ellipsis}
.url svg{flex:none}
.bstar{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#8a938f}
.bstar:hover{background:#0000000d;color:var(--gold)}
.win.browser .wbody{display:flex;flex-direction:column;overflow:hidden}
.page{flex:1;min-height:0;overflow:auto;position:relative;background:#fff}

#dock{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:13px;background:#f5f4efb3;backdrop-filter:blur(12px);box-shadow:0 0 0 1px #ffffff80 inset,0 10px 30px -8px #0006}
#dock button{position:relative;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;transition:transform .15s}
#dock button:hover{transform:translateY(-3px) scale(1.08)}
#dock .ico{border-radius:9px}
#dock .ico svg{width:19px;height:19px}
#dock button.open::after{content:"";position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:#2c3431}
#dock .badge{position:absolute;top:-5px;right:-5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font:700 9.5px/16px var(--f-mono);font-style:normal}
#dock .sep{width:1px;height:24px;background:#00000022}
#dock button.wig{animation:wiggle .4s 4}
.ico{width:100%;height:100%;border-radius:11px;display:grid;place-items:center}
.ico-browser{background:linear-gradient(160deg,#4aa39a,#1f6b64)}
.ico-mail{background:linear-gradient(160deg,#5f9de0,#2d63b0)}
.ico-note{background:linear-gradient(160deg,#f7dd78,#e3b73b)}
.ico-trash{background:linear-gradient(160deg,#e9ebe7,#bfc4bf)}

/* notifiche */
#toasts,.toasts3d{position:absolute;top:10px;right:12px;z-index:8;display:flex;flex-direction:column;gap:8px;width:310px;pointer-events:none}
@media (max-width:760px){#toasts{right:8px;left:8px;width:auto;top:10px}}
.toast{pointer-events:auto;background:#fbfaf6f2;backdrop-filter:blur(10px);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 1px #0000001c,0 12px 30px -10px #0007;font-size:12.5px;animation:tIn .3s cubic-bezier(.2,1.3,.4,1)}
.toast.out{animation:tOut .35s forwards}
@keyframes tIn{from{opacity:0;transform:translateX(30px)}}
@keyframes tOut{to{opacity:0;transform:translateX(30px)}}
.toast .t-head{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.toast .t-app{font:600 10px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);width:100%}
.toast b{font-size:13px}
.toast p{margin:4px 0 0;line-height:1.4;color:#3c4542}
.toast .t-meta{margin-top:6px;font:600 10.5px var(--f-mono);color:var(--muted)}
.toast.click{cursor:pointer}
.toast.click:hover{background:#fff}
.t-trap{background:#1d1716f5;color:#f6ece9;box-shadow:0 0 0 1px #cf3a2d,0 16px 34px -10px #000a}
.t-trap .t-tag{font:700 9.5px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:#ff7a6c;margin-bottom:3px}
.t-trap b{font:700 17px/1.1 var(--f-disp)}

.t-good{box-shadow:0 0 0 1px var(--ok),0 12px 30px -10px #0007}
.t-hint{background:#fff6cff5;box-shadow:0 0 0 1px #e2c55a,0 12px 30px -10px #0007}
.t-hint .t-meta{color:#8a7215}

/* effetti */
#flash{position:absolute;inset:0;z-index:20;pointer-events:none;opacity:0;background:radial-gradient(ellipse at center,#0000 40%,#d1281baa 100%)}
#flash.on{animation:flash .5s}
@keyframes flash{20%{opacity:1}100%{opacity:0}}
.shake{animation:shake .38s}
@keyframes shake{20%{transform:translate(-7px,2px) rotate(-.4deg)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,1px) rotate(.3deg)}80%{transform:translate(3px,0)}}
.glitch #screen{animation:glitch .5s steps(2)}
@keyframes glitch{0%{filter:none}20%{filter:hue-rotate(80deg) saturate(3);clip-path:inset(10% 0 30% 0);transform:translateX(-8px)}40%{filter:invert(1);clip-path:inset(50% 0 5% 0);transform:translateX(6px)}60%{filter:hue-rotate(-60deg);clip-path:inset(0 0 60% 0)}100%{filter:none;clip-path:none;transform:none}}
#fly{position:fixed;inset:0;z-index:40;pointer-events:none}
.float{position:fixed;z-index:60;pointer-events:none;font:700 18px var(--f-mono);color:var(--danger);text-shadow:0 2px 0 #fff,0 0 12px #fff;animation:floatUp 1.3s forwards}
@keyframes floatUp{to{transform:translateY(-60px);opacity:0}}
.ripple{position:fixed;z-index:61;pointer-events:none;width:12px;height:12px;margin:-6px;border-radius:50%;border:2px solid #1f6b6499;animation:rip .5s ease-out forwards}
@keyframes rip{to{transform:scale(4);opacity:0}}
#confetti{position:fixed;inset:0;z-index:70;pointer-events:none}
@media (prefers-reduced-motion:reduce){.shake,.glitch #screen{animation:none}.mug .steam{animation:none}}

/* note / brief */
.win.note .wbody{background:#fffbea}
.brief{padding:18px 20px 22px;display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:22px}
@media (max-width:640px){.brief{grid-template-columns:1fr}.brief .b-side{display:none}}
.b-date{font:600 10px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#8a7a3a;margin-bottom:10px}
.b-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:12.5px}
.b-list li{display:flex;gap:8px;align-items:flex-start;color:#6d6650;line-height:1.3}
.b-list li i{flex:none;width:13px;height:13px;margin-top:1px;border-radius:3px;border:1.5px solid #b8a964;display:grid;place-items:center;font-style:normal;font-size:9px}
.b-list li.done{text-decoration:line-through;color:#a59d82}
.b-list li.done i{background:#b8a964;color:#fffbea}
.b-list li.now{color:#2d2a1f;font-weight:600}
.b-list li.now i{border-color:var(--accent)}
.b-k{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.b-card h2{font:800 clamp(22px,3.2vw,30px)/1.05 var(--f-disp);letter-spacing:-.02em;margin:6px 0 12px;text-wrap:balance}
.b-card p{margin:0 0 10px;line-height:1.5;max-width:58ch;font-size:13.5px}
.b-rules{background:#fff4c9;border-radius:8px;padding:10px 12px;font-size:12.5px!important}
.b-meta{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.b-meta span{font:600 11px var(--f-mono);background:#f5ecc4;color:#5a4f22;border-radius:5px;padding:4px 8px}
.b-go{margin-top:4px;padding:11px 20px;border-radius:9px;background:var(--accent);color:#fff;font-weight:600}
.b-go:hover{filter:brightness(1.1)}

.sum{padding:20px 22px 22px}
.sum h2{font:800 28px/1.05 var(--f-disp);letter-spacing:-.02em;margin:4px 0 14px}
.sum .k{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.sum-nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:16px}
@media (max-width:560px){.sum-nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.sum-nums div{background:var(--chrome);border-radius:8px;padding:9px 11px}
.sum-nums small{display:block;font-size:11px;color:var(--muted)}
.sum-nums b{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
.sum-nums .red b{color:var(--danger)}
.sum-pats{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.sum-pats div{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12.5px;line-height:1.4}
.sum-pats em{grid-row:span 2;font:700 9px var(--f-mono);font-style:normal;letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border-radius:4px;align-self:start;margin-top:2px;background:var(--accent-soft);color:var(--accent)}
.sum-pats em.fell{background:var(--danger-soft);color:var(--danger)}
.sum-pats span{color:#4c5652}
.sum .go{padding:11px 20px;border-radius:9px;background:var(--ink);color:#fff;font-weight:600}
.sum .go:hover{background:#000}
.sum.giveup h2{color:var(--danger)}

.trash-list{list-style:none;margin:0;padding:8px}
.trash-list li button{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;text-align:left;font-size:13px}
.trash-list li button:hover{background:var(--accent-soft)}
.fileic{width:26px;height:32px;border-radius:3px;background:#e3e6e1;flex:none;font:700 7px var(--f-mono);display:grid;place-items:end center;padding-bottom:4px;color:#555}
.fileic.pdf{background:#f3d2cd;color:#a8291d}
.blank{display:grid;place-items:center;height:100%;min-height:160px;color:var(--muted);font-size:13px;text-align:center;padding:20px}
.newtab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;height:100%;padding:20px}
.newtab .sb{width:min(420px,100%);padding:11px 16px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-align:left}
.newtab .tiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.newtab .tiles button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.newtab .tiles i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 16px var(--f-disp);color:#fff;font-style:normal}

/* ---------- POSTA ---------- */

.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 12px var(--f-disp);overflow:hidden;flex:none}

.mail-acts{display:flex;gap:4px;padding:6px 14px;border-bottom:1px solid #eceee9}

.vl-fare{position:relative;background:#fff;border:2px solid #dbe3ec;border-radius:10px;padding:16px;display:flex;gap:10px;cursor:pointer}
.vl-fare:has(input:checked){border-color:#13315c;box-shadow:0 0 0 3px #13315c22}
.vl-fare input{accent-color:#13315c;margin-top:3px}
.vl-fare b{font-size:16px;color:#13315c}
.vl-fare ul{margin:6px 0 0;padding-left:16px;font-size:12px;color:#4a5866;line-height:1.5}
.vl-fare .vl-p{margin-left:auto;font:800 20px var(--f-disp);color:#13315c}
.vl-badge{position:absolute;top:-10px;left:14px;background:#ff6b4a;color:#fff;font:700 10px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.vl-scarce{color:#c23b1c;font-size:11.5px;font-weight:700;margin-top:6px}
.vl-cta{margin-top:18px;background:#ff6b4a;color:#fff;font-weight:800;padding:13px 28px;border-radius:8px;font-size:15px}
.vl-cta:hover{background:#ff5631}
.vl-x{display:flex;flex-direction:column;gap:8px}
.vl-xi{display:flex;align-items:center;gap:12px;background:#fff;border-radius:9px;padding:10px 14px;font-size:13.5px}
.vl-xi .ic{width:38px;height:38px;border-radius:9px;background:#e8eef6;display:grid;place-items:center;flex:none}
.vl-xi .d{flex:1;min-width:0}
.vl-xi small{display:block;color:var(--muted);font-size:11.5px}
.vl-xi .p{font:700 14px var(--f-mono);color:#13315c;font-variant-numeric:tabular-nums}
.sw{position:relative;width:40px;height:23px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:#c8d0d8;transition:.2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px #0004}
.sw input:checked+span{background:#2e8550}
.sw input:checked+span::after{left:20px}
.vl-tot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:14px}
.vl-tot b{font:800 22px var(--f-mono);color:#13315c}
.ov{position:absolute;inset:0;background:#0b1a2e99;display:grid;place-items:center;padding:16px;z-index:5}
.ov-box{background:#fff;border-radius:12px;padding:22px;max-width:420px;width:100%;display:flex;flex-direction:column;gap:12px}
.ov-box h3{margin:0;font:800 20px/1.15 var(--f-disp);color:#13315c}
.ov-box p{margin:0;font-size:13px;color:#4a5866;line-height:1.5}
.ov-box select{padding:10px;border-radius:8px;border:1px solid #c6d1de;font:inherit}
.cabin{background:#fff;border-radius:40px 40px 14px 14px;padding:26px 18px 18px;max-width:330px;margin:0 auto;box-shadow:0 0 0 2px #dbe3ec}
.seats{display:grid;grid-template-columns:repeat(3,1fr) 20px repeat(3,1fr);gap:5px}
.seats .rn{font:600 9px var(--f-mono);color:#9aa8b7;display:grid;place-items:center}
.seat{aspect-ratio:1;border-radius:6px 6px 3px 3px;font:700 9px var(--f-mono);color:#fff;display:grid;place-items:center;transition:transform .12s}
.seat:hover{transform:scale(1.15)}
.seat.x{background:#d6dde5;color:#aab4be;cursor:not-allowed}
.seat.xl{background:#ff6b4a}.seat.fr{background:#2f7fd0}.seat.st{background:#13315c}
.seat.sel{outline:3px solid #2e8550;outline-offset:1px}
.seat-leg{display:flex;gap:12px;justify-content:center;font-size:11px;color:#4a5866;margin:10px 0}
.seat-leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.vl-skip{display:block;margin:10px auto 0;font-size:10.5px;color:#a3afbb;text-decoration:underline}
.vl-sum{background:#fff;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.vl-sum div{display:flex;justify-content:space-between;gap:10px}
.vl-sum .p{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.vl-sum .drip{color:#b23a1f}
.vl-sum .t{border-top:1px solid #e3e8ee;padding-top:8px;margin-top:4px;font-weight:800}
.wait{display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 10px;text-align:center}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid #dbe3ec;border-top-color:#13315c;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* L4 Chirpy */
.site-ch{background:#f6f7fb}
.ch-top{display:flex;align-items:center;gap:16px;padding:10px 18px;background:#fff;border-bottom:1px solid #e6e8f0}
.ch-logo{font:800 22px var(--f-disp);color:#5b4bdb;letter-spacing:-.03em}
.ch-search{flex:1;max-width:280px;border-radius:99px;background:#f3f4f8;padding:8px 14px;font-size:12.5px;color:#9a9db0;text-align:left}
.ch-cover{position:relative;height:120px;overflow:hidden}
.ch-cover img{width:100%;height:100%;object-fit:cover}
.ch-me{display:flex;align-items:flex-end;gap:12px;padding:0 20px;margin-top:-34px;position:relative}
.ch-me img{width:72px;height:72px;border-radius:50%;border:4px solid #f6f7fb;background:#fff}
.ch-me b{font:800 17px var(--f-disp);display:block}
.ch-me small{color:#8b8ea3;font-size:12px}
.ch-body{display:grid;grid-template-columns:200px minmax(0,1fr)}
@media (max-width:640px){.ch-body{grid-template-columns:1fr}.ch-side{flex-direction:row!important;overflow-x:auto}}
.ch-side{display:flex;flex-direction:column;gap:2px;padding:12px 8px}
.ch-side button{text-align:left;padding:9px 12px;border-radius:8px;font-size:13px;white-space:nowrap}
.ch-side button:hover{background:#ecebfb}
.ch-side button.on{background:#e4e1ff;color:#5b4bdb;font-weight:700}
.ch-main{padding:16px 22px 40px}
.ch-main h2{font:800 22px var(--f-disp);margin:0 0 14px}
.ch-it{width:100%;background:#fff;border:1px solid #e6e8f0;border-radius:10px;padding:12px 14px;margin-bottom:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left}
.ch-it small{display:block;color:var(--muted);font-size:11.5px}
.ch-it .chev{color:#b5b8c8}
.ch-main details{margin-top:18px}
.ch-main summary{cursor:pointer;font-size:12px;color:#9a9db0;padding:6px 0}
.ch-hidden{font-size:11.5px;color:#9a9db0;text-decoration:underline;padding:6px 0}
.ch-big{display:block;width:100%;text-align:left;background:#5b4bdb;color:#fff;border-radius:12px;padding:18px;margin-bottom:12px}
.ch-big b{font:800 18px var(--f-disp);display:block}
.ch-big small{opacity:.85;font-size:12.5px}
.ch-link{font-size:12px;color:#8b8ea3;text-decoration:underline}
.ch-faces{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:12px 0 16px;max-width:460px}
.ch-faces button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:#6b6e80}
.ch-faces img{width:100%;aspect-ratio:1;border-radius:50%}
.ch-btn{background:#5b4bdb;color:#fff;font-weight:700;padding:12px 20px;border-radius:99px}
.ch-form{display:flex;flex-direction:column;gap:12px;max-width:440px}
.ch-form input[type=text],.ch-form input[type=password]{padding:10px 12px;border-radius:8px;border:1px solid #d7d9e4;font:inherit;font-size:14px}
.ch-form label{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.ch-form input[type=checkbox]{accent-color:#5b4bdb;width:16px;height:16px;flex:none;margin-top:2px}
.ch-danger{background:#d13b2e;color:#fff;font-weight:700;padding:11px 18px;border-radius:8px;align-self:flex-start}
.ch-num{font:800 64px/1 var(--f-disp);color:#5b4bdb;letter-spacing:-.04em;margin:8px 0}

/* L5 news */
.site-nw{background:#fbf9f4;font-family:var(--f-news);color:#1f1d1a}
.nw-util{display:flex;justify-content:space-between;align-items:center;padding:6px 20px;font:500 11px var(--f-ui);color:#6b655c;border-bottom:1px solid #e8e2d6}
.nw-util button{background:#a3301f;color:#fff;font-weight:700;padding:5px 12px;border-radius:4px;font-size:11px}
.nw-top{text-align:center;border-bottom:3px double #1f1d1a;padding:12px 16px 8px;margin:0 20px}
.nw-mast{font:600 34px/1 var(--f-news);letter-spacing:-.01em}
.nw-top nav{font:500 11px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:#6b655c;margin-top:8px;display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.nw-lay{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;max-width:900px;margin:0 auto;padding:20px 20px 60px}
@media (max-width:720px){.nw-lay{grid-template-columns:1fr}.nw-aside{display:none}}
.nw-art{transition:filter .4s}
.nw-art.locked{filter:blur(5px);user-select:none;pointer-events:none}
.nw-kick{font:700 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:#a3301f}
.nw-art h1{font:600 32px/1.12 var(--f-news);margin:8px 0 10px;text-wrap:balance}
.nw-art .by{font:500 12px var(--f-ui);color:#6b655c;margin-bottom:14px}
.nw-art figure{margin:0 0 16px}
.nw-art figure img{width:100%;aspect-ratio:16/9;object-fit:cover}
.nw-art figcaption{font:400 11.5px var(--f-ui);color:#6b655c;margin-top:6px}
.nw-art p{font-size:17px;line-height:1.6;margin:0 0 14px}
.nw-read{font-family:var(--f-ui);margin-top:14px;padding:11px 18px;border-radius:6px;background:#1f1d1a;color:#fbf9f4;font-weight:600}
.nw-aside h4{font:700 11px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;border-top:2px solid #1f1d1a;padding-top:8px;margin:0 0 10px}
.nw-ml{display:grid;grid-template-columns:64px 1fr;gap:10px;margin-bottom:12px;text-align:left;font:600 13.5px/1.25 var(--f-news)}
.nw-ml img{width:64px;height:64px;object-fit:cover}
.nw-ad{margin-top:18px;font:500 9px var(--f-ui);color:#9b958b;text-transform:uppercase;letter-spacing:.1em;text-align:left;width:100%}
.nw-ad img{margin-top:4px;width:100%;aspect-ratio:1;object-fit:cover}
.nw-wall{position:absolute;left:0;right:0;bottom:0;background:#fff;border-top:4px solid #1f1d1a;padding:18px 22px 22px;font-family:var(--f-ui);box-shadow:0 -20px 50px -10px #0005;z-index:4;max-height:92%;overflow:auto}
.nw-wall h3{font:600 22px var(--f-news);margin:0 0 6px}
.nw-wall p{font-size:12.5px;line-height:1.5;color:#4f4a43;margin:0 0 12px;max-width:70ch}
.nw-acts{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.nw-acc{background:#a3301f;color:#fff;font-weight:700;padding:14px 34px;border-radius:6px;font-size:15px}
.nw-man{font-size:12px;color:#8a847a;text-decoration:underline;display:inline-block;transform-origin:left center}
.nw-tabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid #e5e0d6}
.nw-tabs button{padding:8px 12px;font-size:12.5px;border-bottom:2px solid transparent}
.nw-tabs button.on{border-color:#a3301f;font-weight:700}
.nw-togs{max-height:200px;overflow:auto;border:1px solid #eee9df;border-radius:8px;padding:4px 10px;margin-bottom:12px}
.nw-tog{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #f1ede5;font-size:12.5px}
.nw-rej{font-size:11.5px;color:#9b958b;text-decoration:underline;padding:10px 0;display:inline-block;transform-origin:left center}
.nw-save{padding:10px 16px;border-radius:6px;border:1px solid #cfc8bb;font-size:13px}
.cap{position:absolute;inset:0;z-index:5;display:grid;place-items:center;background:#1f1d1a88;padding:16px;font-family:var(--f-ui)}
.cap-box{width:min(340px,100%);background:#fff;border-radius:6px;overflow:hidden;box-shadow:0 20px 50px #0007}
.cap-h{background:#2f6fdb;color:#fff;padding:14px 16px;font-size:13px}
.cap-h b{display:block;font-size:20px}
.cap-g{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px}
.cap-g button{position:relative;aspect-ratio:1;overflow:hidden}
.cap-g img{width:100%;height:100%;object-fit:cover;transition:transform .15s}
.cap-g button.on img{transform:scale(.82)}
.cap-g button.on::after{content:"✓";position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:50%;background:#2f6fdb;color:#fff;font-size:12px;display:grid;place-items:center}
.cap-f{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-top:1px solid #eee}
.cap-f button.v{background:#2f6fdb;color:#fff;font-weight:700;padding:8px 18px;border-radius:3px;font-size:12px}
.cap-f button.r{font-size:16px;color:#777;width:28px;height:28px;border-radius:4px}
.nw-perm{position:absolute;top:8px;left:12px;z-index:6;width:300px;max-width:calc(100% - 24px);background:#fff;border-radius:10px;padding:12px 14px;box-shadow:0 10px 30px -8px #0006,0 0 0 1px #0002;font-family:var(--f-ui);font-size:13px;animation:popIn .25s}
.nw-perm .r{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.nw-perm .r button{padding:7px 12px;border-radius:6px;font-size:12.5px}
.nw-perm .r .y{background:#1a73e8;color:#fff;font-weight:600}
.nw-perm .r .n{border:1px solid #d0d0d0}
.nw-pop{position:absolute;inset:0;display:grid;place-items:center;background:#1f1d1a77;z-index:5;padding:16px;font-family:var(--f-ui)}
.nw-pop .bx{position:relative;background:#fbf9f4;max-width:400px;width:100%;border-radius:4px;overflow:hidden;text-align:center}
.nw-pop .bx img{width:100%;aspect-ratio:16/7;object-fit:cover}
.nw-pop .bx>div{padding:18px 22px 20px}
.nw-pop h3{font:600 22px/1.15 var(--f-news);margin:0 0 6px}
.nw-pop p{font-size:13px;color:#4f4a43;margin:0 0 12px}
.nw-pop .sub{width:100%;background:#a3301f;color:#fff;font-weight:700;padding:12px;border-radius:4px}
.nw-pop .no{font-size:11px;color:#9b958b;text-decoration:underline;margin-top:10px}
.nw-pop .x{position:absolute;top:6px;right:6px;width:18px;height:18px;font-size:11px;color:#fff;background:#0006;border-radius:50%;line-height:18px;transition:top .2s,right .2s,left .2s}

/* L6 FitLoop */
.site-fl{background:#f4f6ef}
.fl-trial{background:#16291c;color:#d9f2c7;padding:8px 16px;font-size:12.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fl-trial b{font-family:var(--f-mono);color:#b8f27c;font-variant-numeric:tabular-nums}
.fl-trial.over{background:var(--danger);color:#fff}
.fl-promo{background:#b8f27c;color:#16291c;padding:7px 16px;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-weight:600}
.fl-promo b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.fl-promo button{margin-left:auto;background:#16291c;color:#b8f27c;padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700}
.fl-head{display:flex;align-items:center;gap:16px;padding:12px 18px;background:#fff;border-bottom:1px solid #e1e6d8;position:relative}
.fl-logo{font:800 20px var(--f-disp);letter-spacing:-.03em;color:#16291c}
.fl-logo span{color:#57a630}
.fl-head nav{display:flex;gap:12px;font-size:12.5px;color:#5c6855}
.fl-av{margin-left:auto;width:34px;height:34px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px #57a630}
.fl-av img{width:100%;height:100%}
.fl-menu{position:absolute;right:14px;top:52px;background:#fff;border-radius:10px;box-shadow:0 10px 30px -6px #0004,0 0 0 1px #0001;padding:6px;z-index:4;width:190px;display:flex;flex-direction:column;animation:popIn .18s}
.fl-menu button{text-align:left;padding:8px 10px;border-radius:6px;font-size:13px}
.fl-menu button:hover{background:#eef4e6}
.fl-main{padding:20px 20px 40px;max-width:700px;margin:0 auto}
.fl-main h2{font:800 24px var(--f-disp);margin:0 0 12px;color:#16291c}
.fl-dash{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center;background:#fff;border-radius:14px;padding:14px;margin-bottom:12px}
.fl-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fl-stats b{display:block;font:800 22px var(--f-disp);color:#16291c}
.fl-stats small{color:var(--muted);font-size:11.5px}
.fl-wk{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.fl-wk button{background:#fff;border-radius:12px;overflow:hidden;text-align:left;transition:transform .15s}
.fl-wk button:hover{transform:translateY(-2px)}
.fl-wk img{width:100%;aspect-ratio:16/9;object-fit:cover}
.fl-wk span{display:block;padding:8px 10px 10px;font-size:12.5px;font-weight:600}
.fl-wk small{display:block;font-weight:400;color:var(--muted)}
.fl-card{background:#fff;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.fl-big{background:#57a630;color:#fff;font-weight:800;padding:14px 22px;border-radius:10px;font-size:15px;width:100%}
.fl-small{font-size:12.5px;color:#7d8a74;text-decoration:underline;display:inline-block;transition:transform .2s}
.fl-q{display:flex;flex-direction:column;gap:6px;font-size:13px;margin-bottom:14px}
.fl-q b{font-size:13.5px}
.fl-q label{display:flex;gap:8px;align-items:center}
.fl-q input{accent-color:#57a630}
.arena{position:relative;height:150px;border-radius:10px;background:repeating-linear-gradient(45deg,#0000 0 10px,#00000006 10px 20px);margin-top:6px;overflow:hidden}
.fleeing{position:absolute!important;transition:left .24s cubic-bezier(.2,1.4,.4,1),top .24s cubic-bezier(.2,1.4,.4,1),transform .2s;white-space:nowrap}
.fleeing.tired{animation:pant .6s infinite}
@keyframes pant{50%{transform:scale(1.06)}}
.fl-send{background:#16291c;color:#fff;font-weight:700;padding:10px 18px;border-radius:8px}

/* L7 PrimoPass */
.site-pp{background:#fff}
.pp-top{display:flex;align-items:center;gap:14px;padding:12px 20px;background:#0f2a2e;color:#fff}
.pp-logo{font:800 20px var(--f-disp)}
.pp-logo span{color:#f5b700}
.pp-prog{margin-left:auto;display:flex;gap:4px}
.pp-prog i{width:26px;height:5px;border-radius:3px;background:#2c4b50}
.pp-prog i.on{background:#f5b700}
.pp-main{max-width:660px;margin:0 auto;padding:22px 20px 40px}
.pp-main h2{font:800 24px/1.15 var(--f-disp);margin:0 0 10px;text-wrap:balance}
.pp-main p{font-size:13.5px;color:#4b5a5c;line-height:1.5}
.pp-ben{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}
.pp-ben button{background:#f3f7f7;border-radius:10px;overflow:hidden;font-size:12.5px;text-align:left;transition:transform .15s}
.pp-ben button:hover{transform:translateY(-2px)}
.pp-ben img{width:100%;aspect-ratio:16/7;object-fit:cover}
.pp-ben span{display:block;padding:8px 10px}
.pp-ben b{display:block;font-size:14px}
.pp-keep{width:100%;background:#f5b700;color:#2a2000;font-weight:800;padding:15px;border-radius:10px;font-size:16px}
.pp-go{background:#fff;border:1px solid #c9d4d5;color:#4b5a5c;padding:9px 14px;border-radius:8px;font-size:12.5px}
.pp-banner{position:absolute;top:30px;left:0;width:210px;height:84px;border-radius:8px;z-index:3;overflow:hidden;animation:slideBan 3s ease-in-out infinite alternate;cursor:pointer;box-shadow:0 8px 20px -6px #0006}
.pp-banner img{width:100%;height:100%;object-fit:cover}
.pp-banner b{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font:800 17px/1.05 var(--f-disp);text-align:center;background:#d0103aaa}
@keyframes slideBan{to{left:calc(100% - 210px)}}

/* L8 TeleSempre */
.site-ts{background:#eef1f7}
.ts-top{display:flex;align-items:center;gap:16px;padding:12px 18px;background:#fff;border-bottom:3px solid #e6007e}
.ts-logo{font:800 20px var(--f-disp);color:#1b2a6b}
.ts-logo span{color:#e6007e}
.ts-top nav{display:flex;gap:12px;font-size:12.5px;color:#4a557a}
.ts-ban{display:grid;grid-template-columns:minmax(0,1fr) 220px;align-items:center;background:linear-gradient(120deg,#1b2a6b,#4b2a8a);color:#fff;text-align:left;width:100%}

.ts-ban div{padding:14px 20px}
.ts-ban b{font:800 20px var(--f-disp);display:block}
.ts-ban img{height:110px;width:100%;object-fit:cover}
.ts-chat{max-width:540px;margin:14px auto;background:#fff;border-radius:14px;box-shadow:0 8px 30px -12px #0003;display:flex;flex-direction:column;height:400px}
.ts-hd{padding:12px 16px;border-bottom:1px solid #eceff5;display:flex;gap:10px;align-items:center;font-size:13px}
.ts-hd i{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#e6007e,#1b2a6b)}
.ts-hd small{display:block;color:#3aa36b;font-size:11px}
.ts-msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.ts-m{max-width:82%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.4}
.ts-m.b{background:#eef1f7;align-self:flex-start;border-bottom-left-radius:4px}
.ts-m.u{background:#1b2a6b;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.ts-m.op{background:#fde7f3}
.ts-qr{display:flex;flex-wrap:wrap;gap:6px;align-self:flex-start}
.ts-qr button{border:1.5px solid #1b2a6b;color:#1b2a6b;border-radius:99px;padding:6px 12px;font-size:12px;font-weight:600}
.ts-qr button:hover{background:#1b2a6b;color:#fff}
.ts-in{display:flex;gap:8px;padding:10px;border-top:1px solid #eceff5}
.ts-in input{flex:1;min-width:0;border:1px solid #d6dbe6;border-radius:99px;padding:9px 14px;font:inherit;font-size:13px}
.ts-in button{background:#e6007e;color:#fff;border-radius:99px;padding:0 16px;font-weight:700;font-size:13px}
.ts-offer{background:#fff;border:1px solid #e3c7d6;border-radius:12px;overflow:hidden;align-self:flex-start;max-width:82%}
.ts-offer img{width:100%;aspect-ratio:16/7;object-fit:cover}
.ts-offer div{padding:10px 12px}
.ts-offer b{font:800 16px var(--f-disp);display:block;color:#1b2a6b}
.ts-offer button{margin-top:8px;background:#e6007e;color:#fff;font-weight:800;padding:8px 14px;border-radius:99px;font-size:12.5px}
.ts-file{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #e3c7d6;border-radius:8px;padding:8px 10px;margin-top:6px;font-size:12.5px;font-weight:600}
.pdf{background:#5a5e66;padding:16px;min-height:100%}
.pdf-page{background:#fff;max-width:520px;margin:0 auto;padding:26px 30px;font-family:var(--f-news);font-size:13.5px;line-height:1.5;box-shadow:0 6px 20px #0005}
.pdf-page h3{font:600 18px var(--f-news);margin:0 0 4px}
.pdf-page .f{border-bottom:1px solid #999;padding:4px 0;margin:6px 0;font-family:var(--f-mono);font-size:12px}
.pdf-page label{display:flex;gap:8px;font-family:var(--f-ui);font-size:12px;margin:10px 0;align-items:flex-start}
.pdf-big{width:100%;background:#e6007e;color:#fff;font:700 14px var(--f-ui);padding:12px;border-radius:8px;margin:10px 0}
.pdf-sign{font:600 13px var(--f-ui);padding:9px 14px;border:1px solid #333;border-radius:6px}
.pdf-otp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-family:var(--f-ui);margin-top:10px}
.pdf-otp input{width:130px;padding:8px;border:1px solid #999;border-radius:6px;font:600 16px var(--f-mono);letter-spacing:.15em;text-align:center}

/* L9 Ombra */
.site-om{background:#14121a;color:#e7e3f0}
.om-top{padding:14px 20px;display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #2a2633}
.om-logo{font:800 22px var(--f-disp);letter-spacing:-.04em}
.om-tag{font-size:11.5px;color:#8c849e}
.om-hero img{width:100%;aspect-ratio:16/4;object-fit:cover}
.om-wrap{max-width:560px;margin:0 auto;padding:20px}
.om-wrap h1{font:800 24px var(--f-disp);margin:0 0 6px}
.om-wrap p{color:#a59db8;font-size:13px;margin:0 0 14px}
.om-row{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:8px;background:#1e1b26;margin-bottom:6px;font-size:13px}
.om-row input{accent-color:#9b7bff}
.om-arena{position:relative;height:120px;display:grid;place-items:center}
.om-del{background:#d13b2e;color:#fff;font-weight:700;padding:11px 20px;border-radius:8px}
.runner{position:absolute;z-index:3;background:#d13b2e;color:#fff;font:700 13px var(--f-ui);padding:9px 14px;border-radius:8px;box-shadow:0 6px 16px -4px #000a;transition:left 1.1s cubic-bezier(.5,0,.3,1),top 1.1s cubic-bezier(.5,0,.3,1);white-space:nowrap}
.flyer{position:fixed;background:#d13b2e;color:#fff;font:700 13px var(--f-ui);padding:9px 14px;border-radius:8px;box-shadow:0 6px 16px -4px #000a;white-space:nowrap;pointer-events:none}
.flyer.doc{background:#fff;color:#a8291d;border:1px solid #e3c7d6}
.ad{display:flex;flex-direction:column;background:#1e1b26;color:#e7e3f0;height:100%}
.ad img{width:100%;aspect-ratio:16/9;object-fit:cover}
.ad div{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.ad b{font:800 15px/1.15 var(--f-disp)}
.ad p{margin:0;font-size:11.5px;color:#a59db8}
.ad button{background:#9b7bff;color:#fff;font-weight:700;padding:8px;border-radius:7px}

/* ---------- TELEFONO ---------- */
#phoneOv{position:fixed;inset:0;z-index:55;background:#0a0c0bd9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.bigphone{width:310px;max-width:100%;height:min(600px,calc(100vh - 90px));border-radius:42px;background:#151716;padding:11px;box-shadow:0 30px 80px #000,0 0 0 2px #2c2f2d inset;animation:phUp .35s cubic-bezier(.2,1.2,.4,1)}
@keyframes phUp{from{transform:translateY(60px) rotate(6deg);opacity:0}}
.bigphone .scr{position:relative;height:100%;border-radius:32px;overflow:hidden;background:#101114;color:#f1eff6;display:flex;flex-direction:column}
.ph-st{display:flex;justify-content:space-between;padding:12px 22px 4px;font:600 12px var(--f-ui);flex:none}
.ph-body{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column}
.ph-lockscr{background:radial-gradient(120% 70% at 30% 0%,#2a7b73 0%,#16403c 40%,#0d1615 100%);padding:10px 14px 18px}
.ph-clock{font:700 64px/1 var(--f-disp);text-align:center;letter-spacing:-.03em;margin-top:18px}
.ph-date{text-align:center;font-size:13px;opacity:.8;margin:6px 0 18px;text-transform:capitalize}
.ph-notes{display:flex;flex-direction:column;gap:8px}
.ph-note{text-align:left;background:#ffffff26;backdrop-filter:blur(10px);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:12.5px;animation:popIn .3s}
.ph-note:hover{background:#ffffff3a}
.ph-note .ph-app{font:600 10px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.ph-empty{text-align:center;opacity:.7;font-size:13px;margin-top:30px;line-height:1.5}
.ph-appscr{background:#f5f4f0;color:#1d2321}
.ph-back{align-self:flex-start;padding:8px 16px;font-size:13px;color:#2f6fdb;font-weight:600}
.ph-in{flex:1;display:flex;flex-direction:column;padding:4px 16px 20px;gap:12px}
.ph-close{padding:10px 20px;border-radius:99px;background:#ffffff26;color:#fff;font-weight:600;font-size:13px}
.ph-close:hover{background:#ffffff3a}
.sms-h{text-align:center;font-weight:700;font-size:14px;padding-bottom:8px;border-bottom:1px solid #e3e1db}
.sms-h small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.sms-b{align-self:flex-start;max-width:88%;background:#e7e6e1;border-radius:18px 18px 18px 4px;padding:10px 12px;font-size:13.5px;line-height:1.4}
.sms-b b{font-family:var(--f-mono);letter-spacing:.08em;user-select:all}
.bank{display:flex;flex-direction:column;gap:12px;align-items:stretch}
.bank-h{display:flex;align-items:center;gap:8px;font:800 15px var(--f-disp);color:#0f3d6e}
.bank-h i{width:26px;height:26px;border-radius:7px;background:#0f3d6e}
.bank-amt{font:800 38px/1 var(--f-disp);text-align:center;margin:10px 0 0}
.bank-to{text-align:center;font-size:13px;color:var(--muted)}
.bank-box{background:#fff;border-radius:12px;padding:12px;font-size:12.5px;line-height:1.6}
.bank-box div{display:flex;justify-content:space-between}
.bank-ok{background:#0f7a4e;color:#fff;font-weight:800;padding:14px;border-radius:12px;font-size:15px}
.bank-no{color:#b23a1f;font-weight:600;font-size:13px;padding:6px}
.nm{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.nm h4{margin:10px 0 0;font:800 19px/1.2 var(--f-disp)}
.nm p{margin:0;font-size:12.5px;color:var(--muted)}
.nm-row{display:flex;gap:12px}
.nm-row button{width:72px;height:72px;border-radius:50%;background:#e4e1ff;color:#5b4bdb;font:800 26px var(--f-disp);transition:transform .12s}
.nm-row button:hover{transform:scale(1.08)}
.app-fl{display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center}
.app-fl img{border-radius:16px;aspect-ratio:16/10;object-fit:cover}
.app-fl h4{margin:0;font:800 19px/1.2 var(--f-disp);color:#16291c}
.app-fl p{margin:0;font-size:12.5px;color:#5c6855}
.app-fl .big{background:#57a630;color:#fff;font-weight:800;padding:14px;border-radius:12px}
.hold{position:relative;overflow:hidden;border-radius:12px;padding:13px;font-weight:700;font-size:13px;color:#b23a1f;background:#f6e1dc;user-select:none;touch-action:none;--p:0}
.hold::before{content:"";position:absolute;inset:0;width:calc(var(--p)*100%);background:#e8a597}
.hold span{position:relative}
.om-ph{display:flex;flex-direction:column;gap:12px;background:#14121a;color:#e7e3f0;margin:-4px -16px -20px;padding:16px;flex:1}
.om-ph h4{font:800 21px/1.1 var(--f-disp);margin:0}
.om-ph p{font-size:12.5px;color:#a59db8;margin:0;line-height:1.45}
.om-ph .keep{background:#9b7bff;color:#fff;font-weight:800;padding:14px;border-radius:14px;margin-top:auto}
.slider{position:relative;height:54px;border-radius:99px;background:#2a2633;overflow:hidden;touch-action:none}
.slider span{position:absolute;inset:0;display:grid;place-items:center;font-size:13px;color:#8c849e;pointer-events:none}
.slider .knob{position:absolute;left:4px;top:4px;width:46px;height:46px;border-radius:50%;background:#d13b2e;display:grid;place-items:center;color:#fff;font-weight:800;cursor:grab}

/* ---------- 3D ---------- */
#stage3d{position:fixed;inset:0;z-index:45;overflow:hidden;touch-action:none;cursor:grab;
  background:radial-gradient(ellipse at 50% 40%,#1b1830 0%,#07060d 70%);color:#eee;opacity:0;transition:opacity .8s}
#stage3d.on{opacity:1}
#stage3d:active{cursor:grabbing}
#stage3d .stars{position:absolute;inset:-50%;background-image:radial-gradient(1px 1px at 10% 20%,#fff8 50%,#0000),radial-gradient(1px 1px at 70% 60%,#fff6 50%,#0000),radial-gradient(1.5px 1.5px at 40% 80%,#fff7 50%,#0000),radial-gradient(1px 1px at 85% 15%,#fff8 50%,#0000);background-size:180px 180px,240px 240px,300px 300px,210px 210px}
.vp{position:absolute;inset:0}
.world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.ring{position:absolute;transform-style:preserve-3d}
.p3{position:absolute;left:0;top:0;width:260px;transform-style:preserve-3d;backface-visibility:hidden;background:#f7f6f1;color:#1d2321;border-radius:10px;overflow:hidden;box-shadow:0 0 40px -6px #7b6bff66}
.p3 img{width:100%;aspect-ratio:16/7;object-fit:cover}
.p3 .tb{height:24px;background:#e4e6e1;font:600 11px var(--f-ui);display:flex;align-items:center;padding:0 10px;color:#56605c}
.p3 .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.p3 p{margin:0;font-size:13px;line-height:1.35}
.p3 .big{background:#e3332b;color:#fff;font-weight:800;padding:10px 16px;border-radius:7px;font-size:14px}
.p3 .small{font-size:11px;color:#8a908d;text-decoration:underline}
.tok{position:absolute;left:0;top:0;transform-style:preserve-3d;padding:7px 12px;border-radius:7px;background:#ffffffe8;color:#141414;font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;box-shadow:0 0 18px #9ff5e388;cursor:pointer;backface-visibility:hidden}
.tok:hover{background:#9ff5e3}
.door{position:absolute;left:0;top:0;width:240px;height:320px;border-radius:120px 120px 8px 8px;background:radial-gradient(ellipse at 50% 30%,#fff 0%,#c9fff3 40%,#5fd6bf 100%);box-shadow:0 0 90px #9ff5e3;display:grid;place-items:center;color:#063b33;font:800 30px var(--f-disp);letter-spacing:.06em;cursor:pointer;backface-visibility:hidden}
.floor{position:absolute;left:-2000px;top:-2000px;width:4000px;height:4000px;background-image:linear-gradient(#7b6bff44 1px,#0000 1px),linear-gradient(90deg,#7b6bff44 1px,#0000 1px);background-size:120px 120px;-webkit-mask:radial-gradient(circle,#000 0,#0000 60%);mask:radial-gradient(circle,#000 0,#0000 60%)}
.hud3d{position:absolute;left:0;right:0;top:0;display:flex;gap:14px;align-items:center;padding:12px 16px;font-size:12.5px;background:linear-gradient(#000a,#0000);z-index:3;flex-wrap:wrap}
.hud3d .hud-pat .pb{background:#ffffff22}
.hud3d .hud-spend,.hud3d .hud-time{background:#ffffff1a;color:#fff}
.hud3d .hud-time.low{background:var(--danger)}
.hud3d .found{font:700 12px var(--f-mono);color:#9ff5e3}
.hud3d .goal{opacity:.8;margin-left:auto}
.ctl3d{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;z-index:3}
.ctl3d button{width:44px;height:44px;border-radius:50%;background:#ffffff1f;color:#fff;font-size:18px;backdrop-filter:blur(6px)}
.ctl3d button:hover{background:#ffffff38}
.toasts3d{top:56px;right:16px}
.ov3d{position:absolute;inset:0;display:grid;place-items:center;z-index:5;background:#000b;padding:16px}
.ov3d .win{position:relative;animation:popIn .3s;width:min(520px,100%)}
.ays{padding:26px 24px 22px;text-align:center}
.ays h2{font:800 40px/1 var(--f-disp);letter-spacing:-.03em;margin:0 0 8px}
.ays h2 span{color:#ff5a47}
.ays p{margin:0 0 18px;color:var(--muted);font-size:13.5px}
.ays .row{display:flex;gap:10px;justify-content:center;transition:all .2s}
.ays .row.swap{flex-direction:row-reverse}
.ays button{padding:12px 24px;border-radius:9px;font-weight:700}
.ays .y{background:var(--ink);color:#fff}
.ays .n{background:#ff5a47;color:#fff;font-size:16px;padding:14px 30px}

/* ---------- FINALE ---------- */
#final{position:fixed;inset:0;z-index:80;overflow:auto;background:#f4f1ea;color:#1d2321;padding:0 16px}
.fin{max-width:960px;margin:0 auto;padding-block:48px 64px}
.fin .k{font:600 11px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--danger)}
.fin h1{font:800 clamp(38px,7vw,80px)/.95 var(--f-disp);letter-spacing:-.035em;margin:10px 0 18px;text-wrap:balance}
.fin h1 span{color:#ff5a47}
.fin .lede{font-size:17px;line-height:1.55;max-width:60ch;margin:0 0 30px;color:#3f4744}
.fin-nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:44px}
.fin-nums div{border-top:2px solid #1d2321;padding-top:10px}
.fin-nums b{display:block;font:600 28px var(--f-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.fin-nums small{font-size:12.5px;color:#5d6864}
.fin-nums .red b{color:var(--danger)}
.fin h2{font:800 30px var(--f-disp);letter-spacing:-.02em;margin:0 0 6px}
.fin .h2s{color:#5d6864;margin:0 0 18px;font-size:14px}
.best{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.bc{background:#fff;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 1px #0000000f}
.bc .st{font:700 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;align-self:flex-start;padding:3px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.bc .st.fell{background:var(--danger-soft);color:var(--danger)}
.bc .st.none{background:#eee;color:#888}
.bc h3{margin:4px 0 0;font:800 20px/1.1 var(--f-disp)}
.bc .en{font:500 11px var(--f-mono);color:#7b8581}
.bc p{margin:0;font-size:13.5px;line-height:1.5;color:#3f4744}
.fin-foot{margin-top:40px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.fin-foot p{flex:1;min-width:240px;margin:0;font-size:14px;color:#3f4744;max-width:56ch}
.fin-again{padding:13px 22px;border-radius:9px;background:#1d2321;color:#fff;font-weight:600}
/* ---------- RADAR ---------- */
.ico-radar{background:linear-gradient(160deg,#1f2e28,#0c1210)}
.win.radar .wbody{background:#0f1513;color:#dfe9e4}
.rd-tabs{position:sticky;top:0;z-index:2;display:flex;gap:4px;padding:8px 10px;background:#0f1513;border-bottom:1px solid #22302b}
.rd-tabs button{padding:6px 13px;border-radius:99px;font-size:12.5px;font-weight:600;color:#8fa39b}
.rd-tabs button:hover{background:#17211d}
.rd-tabs button.on{background:#7fe3b0;color:#0f1513}
.rd-body{padding:14px 16px 24px}
.rd-hero{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rd-hero>div{background:#17211d;border-radius:10px;padding:10px 12px;min-width:0}
.rd-hero .big{grid-column:1/-1;padding:14px}
.rd-hero small{display:block;font:600 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:#7e938a;margin-bottom:3px}
.rd-hero b{font:600 16px var(--f-mono);font-variant-numeric:tabular-nums}
.rd-hero .big b{display:block;font-size:36px;line-height:1.05;color:#7fe3b0;letter-spacing:-.03em}
.rd-hero .big em{font-style:normal;font-size:14px;letter-spacing:0;color:#8fa39b}
.rd-hero .big span{display:block;font-size:12px;color:#8fa39b;margin-top:4px}
.rd-hero .red b{color:#ff8a7a}
.win.radar h4{font:600 10px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:#7e938a;margin:20px 0 8px}
.rd-subs,.rd-svc,.rd-ch,.rd-feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rd-subs li,.rd-svc li{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;background:#17211d;border-radius:10px;padding:9px 11px;font-size:13px}
.rd-svc li{grid-template-columns:30px minmax(0,1fr);align-items:start}
.rd-subs li>i,.rd-svc li>i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font:800 13px var(--f-disp);font-style:normal}
.rd-subs small,.rd-svc small{display:block;font-size:11.5px;color:#8fa39b;line-height:1.35}
.rd-subs .r{text-align:right;white-space:nowrap}
.rd-subs .r b{font:600 13.5px var(--f-mono);font-variant-numeric:tabular-nums}
.rd-subs .r b small{display:inline;font-weight:400}
.rd-subs li.trial .r b{color:#f2c76b}
.rd-subs li.off,.rd-svc li.off{opacity:.55}
.rd-subs li.off>div>b{text-decoration:line-through}
.rd-subs li.none,.rd-svc li.none{display:block;color:#8fa39b;font-size:12.5px}
.rd-ch{gap:0}
.rd-ch li{display:flex;justify-content:space-between;gap:10px;font:500 12px var(--f-mono);padding:5px 2px;border-bottom:1px dashed #22302b;font-variant-numeric:tabular-nums}
.rd-ch li.t{color:#ff8a7a}
.rd-free{display:block;width:100%;text-align:left;margin-top:18px;padding:10px 12px;border-radius:10px;border:1px dashed #2f4a40;color:#7fe3b0;font-size:12.5px;line-height:1.4}
.rd-free:hover{background:#17211d}

/* ---------- AGENDA ---------- */
#agenda{position:fixed;inset:0;z-index:150;display:grid;place-items:center;padding:24px 16px;overflow:auto;background:radial-gradient(ellipse at 50% 55%,#4a3122eb 0%,#150d09f7 75%);animation:fadeIn .35s}
#agenda.out{animation:agOut .62s forwards}
@keyframes agOut{60%{opacity:1}to{opacity:0}}
.ag-book{position:relative;width:min(920px,100%);display:grid;grid-template-columns:1fr 1fr;perspective:2200px;transform:rotate(-1.2deg);animation:agIn .7s cubic-bezier(.2,1,.3,1) both}
@keyframes agIn{from{transform:translateY(80vh) rotate(9deg)}}
#agenda.out .ag-book{animation:agDown .6s cubic-bezier(.6,0,.9,.4) forwards}
@keyframes agDown{to{transform:translateY(90vh) rotate(8deg)}}
.ag-book::before{content:"";position:absolute;inset:-9px -11px;border-radius:12px;background:linear-gradient(135deg,#5a3d2e,#2f1e16);box-shadow:0 30px 60px -10px #000c}
.ag-leaf{position:relative;display:flex;transform-style:preserve-3d;transform-origin:right center;animation:agFlip .9s .35s cubic-bezier(.3,.6,.2,1) both}
@keyframes agFlip{from{transform:rotateY(180deg)}}
.ag-book.quick,.ag-book.quick .ag-leaf{animation-duration:.01s;animation-delay:0s}
.ag-page{position:relative;flex:1;min-width:0;min-height:min(600px,calc(100vh - 90px));padding:24px 30px 28px 38px;background-color:#f6efdb;background-image:repeating-linear-gradient(#0000 0 31px,#8fb0c252 31px 32px);display:flex;flex-direction:column}
.ag-page::before{content:"";position:absolute;top:0;bottom:0;left:26px;width:1px;background:#d9716a59}
.ag-l{backface-visibility:hidden;border-radius:5px 0 0 5px;box-shadow:inset -34px 0 30px -26px #3a2a1a66;background-position:0 64px}
.ag-r{border-radius:0 5px 5px 0;box-shadow:inset 34px 0 30px -26px #3a2a1a66;background-position:0 -12px}
.ag-back{position:absolute;inset:0;transform:rotateY(180deg);backface-visibility:hidden;border-radius:0 8px 8px 0;background:linear-gradient(135deg,#5a3d2e,#3a261c);display:grid;place-items:center;color:#d9b98a;font:600 22px/1.3 var(--f-news);letter-spacing:.24em;text-transform:uppercase;text-align:center}
.ag-back::after{content:"";position:absolute;top:0;bottom:0;right:30px;width:9px;background:#1b1210}
.ag-date{position:relative;z-index:1;margin:-24px -30px 0 -38px;padding:16px 30px 0 38px;height:100px;background:#f6efdb;border-bottom:2px solid #b5452f;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:14px;align-content:center;color:#b5452f}
.ag-day{grid-row:1/3;font:800 68px/1 var(--f-disp);letter-spacing:-.04em}
.ag-wd{align-self:end;font:700 15px/1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase}
.ag-my{align-self:start;margin-top:6px;font:500 13px/1 var(--f-ui);color:#8a5a4a;text-transform:capitalize}
.ag-hr{grid-column:3;grid-row:1/3;align-self:center;font:600 11px var(--f-mono);color:#8a5a4a}
.pencil{font-family:'Caveat','Segoe Print','Bradley Hand',cursive;font-weight:500;color:#38383d;filter:url(#pencil);font-size:25px;line-height:32px}
.pencil.red{color:#c2332b}
.pencil h3{font-size:31px;font-weight:700;line-height:32px;margin:0;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
.pencil h2{font-size:44px;font-weight:700;line-height:64px;margin:0}
.pencil p{margin:0}
.ag-list{list-style:none;margin:32px 0 0;padding:0}
.ag-list li{display:flex;gap:11px;align-items:flex-start}
.ag-list i{flex:none;position:relative;width:17px;height:17px;margin-top:9px;border:2px solid currentColor;border-radius:3px 4px 2px 5px;transform:rotate(-3deg)}
.ag-list li.done span{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.ag-list li.done i::after{content:"";position:absolute;left:3px;top:-9px;width:8px;height:17px;border:solid currentColor;border-width:0 3px 3px 0;transform:rotate(40deg)}
.ag-list li.now span{background:linear-gradient(#ffe86eb0,#ffe86eb0) no-repeat 0 62%/100% 58%;font-weight:700}
.ag-list li.fail span{color:#c2332b;font-weight:700;text-decoration:underline wavy;text-decoration-thickness:2px}
.ag-n{font-size:22px;opacity:.7}
.ag-notes{list-style:none;margin:0;padding:0}
.ag-notes li{position:relative;padding-left:22px}
.ag-notes li::before{content:"–";position:absolute;left:2px}
.ag-pat{margin-top:32px!important;opacity:.8}
.ag-over{font-size:clamp(40px,5vw,58px)!important;line-height:64px!important;transform:rotate(-3deg);transform-origin:left center;margin:16px 0 0!important}
.ag-scr{display:block;width:82%;height:20px;margin:-10px 0 22px}
.w{clip-path:inset(-20% 100% -20% -5%);animation:agW .5s linear forwards;animation-delay:var(--d,0s)}
@keyframes agW{to{clip-path:inset(-20% -5% -20% -5%)}}
.ag-go{align-self:flex-end;margin-top:auto;font:700 27px/1 'Caveat','Segoe Print',cursive;color:#38383d;padding:9px 24px 12px;border:2.5px solid #38383dcc;border-radius:50% 46% 52% 48%/58% 62% 44% 50%;transform:rotate(-2deg);filter:url(#pencil);transition:background .15s,transform .15s}
.ag-go:hover,.ag-go:focus-visible{background:#ffe86eb0;transform:rotate(-1deg) scale(1.04)}
.ag-ribbon{position:absolute;bottom:-28px;left:44px;width:14px;height:56px;background:#b5342c;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
@media (max-width:700px){
 .ag-book{grid-template-columns:1fr;transform:none}
 .ag-leaf{animation:none}.ag-back{display:none}
 .ag-page{min-height:0}.ag-l{border-radius:5px 5px 0 0}.ag-r{border-radius:0 0 5px 5px}
 .pencil h2{font-size:36px}
}
@media (prefers-reduced-motion:reduce){.ag-book,.ag-leaf,.w{animation:none!important}.w{clip-path:none}}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function tone(f,d,type='sine',v=.08,w=0,slide){const c=AC;if(!c||S.muted)return;const t=c.currentTime+w;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.02);}
function noise(d,v=.08,f=1200,w=0,q=1){const c=AC;if(!c||S.muted)return;const t=c.currentTime+w;const b=c.createBuffer(1,Math.max(1,c.sampleRate*d),c.sampleRate);const a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;const s=c.createBufferSource();s.buffer=b;const fl=c.createBiquadFilter();fl.type='bandpass';fl.frequency.setValueAtTime(f,t);fl.frequency.exponentialRampToValueAtTime(f*3,t+d);fl.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl).connect(g).connect(c.destination);s.start(t);}

 case 'tap':tone(700,.05,'sine',.05);break;
 case 'open':tone(520,.08,'sine',.04);tone(780,.1,'sine',.04,.05);break;
 case 'error':tone(150,.32,'sawtooth',.09,0,80);tone(155,.32,'square',.04,0,85);break;
 case 'soft':tone(240,.14,'triangle',.07,0,180);break;
 case 'coin':noise(.06,.08,3000,0,2);tone(1568,.07,'square',.04,.04);tone(2093,.3,'square',.04,.1);break;
 case 'win':[523,659,784,1047].forEach((f,i)=>tone(f,.28,'triangle',.08,i*.09));break;
 case 'notify':tone(880,.12,'sine',.07);tone(1320,.2,'sine',.06,.1);break;
 case 'whoosh':noise(.35,.1,400,0,.8);break;
 case 'shrink':tone(900,.08,'sine',.04,0,500);break;
 case 'glitch':noise(.18,.12,800,0,3);tone(60,.15,'square',.06);break;
 case 'collect':[988,1319,1760].forEach((f,i)=>tone(f,.18,'sine',.07,i*.06));break;
 case 'boot':[262,392,523].forEach((f,i)=>tone(f,.9,'sine',.05,i*.05));break;
 case 'hold':[523,587,659,587,523,494,523].forEach((f,i)=>tone(f,.18,'square',.02,i*.2));break;
 case 'tick':tone(1400,.03,'square',.05);break;
 case 'buzz':tone(95,.35,'sawtooth',.06);tone(95,.35,'sawtooth',.06,.45);break;
 case 'hint':tone(1047,.1,'sine',.06);tone(1568,.18,'sine',.05,.08);break;
 case 'pop':tone(320+x*55,.07,'square',.035);tone(640+x*110,.05,'sine',.04,.02);break;
 case 'thud':tone(110,.18,'sine',.16,0,60);noise(.06,.06,300);break;
 case 'suck':noise(.6,.12,200,0,.6);tone(900,.6,'sawtooth',.04,0,60);break;
 case 'page':noise(.28,.07,700,0,.7);noise(.12,.04,1800,.12,.8);break;
 case 'off':tone(420,.55,'sine',.07,0,40);noise(.08,.05,3000);break;

}}

function flee(btn,area,{radius=90,tired=5,onTired}={}){
 let dodges=0,isT=false,last=0;
 const ar0=area.getBoundingClientRect(),br0=btn.getBoundingClientRect();
 btn.classList.add('fleeing');btn.style.left=Math.max(4,br0.left-ar0.left)+'px';btn.style.top=Math.max(4,br0.top-ar0.top)+'px';
 function dodge(px,py){
  const now=performance.now();if(isT||now-last<230)return;last=now;dodges++;snd('whoosh');
  const ar=area.getBoundingClientRect(),br=btn.getBoundingClientRect();
  const cx=br.left+br.width/2-ar.left,cy=br.top+br.height/2-ar.top;let dx=cx-(px-ar.left),dy=cy-(py-ar.top);const d=Math.hypot(dx,dy)||1;
  let nx=cx+dx/d*rnd(120,210)-br.width/2,ny=cy+dy/d*rnd(60,120)-br.height/2;
  const mx=ar.width-br.width-4,my=ar.height-br.height-4;
  if(nx<4||ny<4||nx>mx||ny>my){nx=rnd(4,Math.max(5,mx));ny=rnd(4,Math.max(5,my));}
  btn.style.left=nx+'px';btn.style.top=ny+'px';
  if(dodges>=tired){isT=true;btn.classList.add('tired');onTired&&onTired();}
 }
 area.addEventListener('pointermove',e=>{if(e.pointerType==='touch'||isT)return;const br=btn.getBoundingClientRect();if(Math.hypot(e.clientX-(br.left+br.width/2),e.clientY-(br.top+br.height/2))<radius)dodge(e.clientX,e.clientY);});
 btn.addEventListener('pointerdown',e=>{if(!isT){btn.dataset.block='1';dodge(e.clientX,e.clientY);}});
 return{tired:()=>isT};
}

/* Site: ogni elemento con data-go porta a una pagina. Le pagine fuori dal percorso costano 1 di pazienza. */
function Site(B,cfg){
 const hist=[];
 function go(key,free){
  if(!L||L.dead)return;
  const i=String(key).indexOf(':'),name=i<0?key:key.slice(0,i),arg=i<0?undefined:key.slice(i+1),p=cfg.pages[name];
  if(!p)return;
  if(!free&&!p.ok)detour();
  hist.push(key);if(hist.length>40)hist.shift();
  B.setUrl(cfg.base+(typeof p.u==='function'?p.u(arg):(p.u||'')));
  B.show(cfg.shell(p.h(arg),name,arg));
  go.wire(B.page);
  if(cfg.wire)cfg.wire(B.page,name,arg);
  if(p.b)p.b(B.page,arg);
 }
 go.wire=root=>on(root,'[data-go]',(e,b)=>go(b.dataset.go));
 B.onBack=()=>{if(hist.length>1){hist.pop();go(hist.pop(),true);}else snd('soft');};
 return go;
}

 const FR=['Giulia','Marco','Zia Pina','Luca','Sara','Fede','Elena','Chiara','Rocco','Anna','Dario','Vale'];
