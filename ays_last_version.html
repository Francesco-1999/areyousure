 const SEC={Profilo:[['nome','Nome visualizzato',NM()],['bio','Bio','Caffè, montagna, opinioni non richieste'],['foto','Foto profilo','Aggiornata nel 2019']],Notifiche:null,Privacy:[['vis','Chi può vedere i tuoi post','Tutti'],['num','Chi può trovarti con il numero','Tutti']],Sicurezza:[['pw','Password','Modificata 3 anni fa'],['dev','Dispositivi connessi','4']],Aspetto:[['tema','Tema','Automatico']],'Dati e personalizzazione':[['dl','Scarica i tuoi dati','Richiede fino a 30 giorni'],['ads','Personalizzazione annunci','Attiva'],['cron','Cronologia attività','4.213 video di gatti']],Aiuto:[['help','Centro assistenza','Le risposte che cerchi (forse)']]};
 const DET={nome:'Il nome si può cambiare una volta ogni 60 giorni.',bio:'Massimo 160 caratteri. Gli annunci ne leggono ogni parola.',foto:'Carica una nuova foto: verrà usata anche per il riconoscimento dei volti.',vis:'Hai scelto «Solo amici». All’aggiornamento successivo è tornato «Tutti».',num:'Chiunque abbia il tuo numero può trovarti. Anche chi non conosci.',pw:'La password è sul post-it. Lo sappiamo tutti.',dev:'Telefono, computer, tablet e un tostapane di marca sconosciuta.',tema:'Tema scuro attivato. Le trappole restano dove sono.',dl:'Richiesta inviata. Riceverai un link quando avrai dimenticato di averla fatta.',ads:'Disattivata. Si riattiverà al prossimo aggiornamento delle condizioni.',cron:'Chirpy ricorda ogni secondo passato su ogni post, dal 2014.',help:'Articolo più letto: «Come trovare nuovi amici». Su come andarsene, nessun articolo.'};
 const post=([f,n,t,img,sd,lk])=>`<div class="ch-post"><div class="ch-ph"><img src="${IMG.face(f)}" alt=""><div><b>${n}</b><small>2 h</small></div></div><p>${t}</p>${img?`<img class="ch-pi" src="${IMG.scene(img,640,300,sd)}" alt="">`:''}<div class="ch-pa"><button data-a="like" data-n="${lk}">♡ ${lk}</button><button data-go="notifiche">Commenta</button><button data-go="cerca">Condividi</button></div></div>`;
 const shell=(body,cur)=>`<div class="ch-top"><button class="ch-logo" data-go="feed">chirpy</button><button class="ch-search" data-go="cerca">Cerca su Chirpy</button><span class="ch-ic"><button data-go="notifiche">Notifiche</button><button data-go="profilo" aria-label="Il tuo profilo"><img src="${IMG.face(1)}" alt="Profilo"></button></span></div>${body}`;
 const settings=(k,inner)=>`<div class="ch-cover"><img src="${IMG.scene('city',1000,240,4)}" alt=""></div><div class="ch-me"><img src="${IMG.face(1)}" alt=""><div><b>${NM()}</b><small>@${esc(S.name.toLowerCase().replace(/\s+/g,''))} · 342 amici</small></div></div><div class="ch-body"><aside class="ch-side">${Object.keys(SEC).map(s=>`<button data-go="set:${s}"${s===k?' class="on"':''}>${s}</button>`).join('')}</aside><main class="ch-main">${inner}</main></div>`;
 const row=([id,t,s])=>`<button class="ch-it" data-go="det:${id}"><span>${t}<small>${s}</small></span><span class="chev">›</span></button>`;
 const pages={
  feed:{u:'',h:()=>`<div class="ch-feed">${POSTS.map(post).join('')}</div>`,b:r=>on(r,'[data-a=like]',(e,b)=>{b.textContent='♥ '+(+b.dataset.n+1);detour();})},
  cerca:{u:'/cerca',h:()=>`<div class="ch-feed"><h2>Persone che potresti conoscere</h2><div class="ch-faces">${FR.slice(0,6).map((n,i)=>`<button data-a="fol"><img src="${IMG.face(i+2)}" alt="">${n}</button>`).join('')}</div><p style="font-size:12.5px;color:#6b6e80">Suggerimenti basati sulla tua rubrica, che Chirpy ha letto nel 2016.</p></div>`,b:r=>on(r,'[data-a=fol]',(e,b)=>{b.style.opacity=.5;detour();toast({app:'Chirpy',title:'Ora segui una persona in più',body:'Proprio mentre te ne stavi andando.',dur:2400});})},
  notifiche:{u:'/notifiche',h:()=>`<div class="ch-feed"><h2>Notifiche</h2>${['Giulia ha commentato la tua foto','Marco ti ha menzionato in un post','La zia Pina ha messo «mi piace» a un tuo ricordo','3 amici ti stanno cercando'].map(t=>`<button class="ch-it" data-go="feed"><span>${t}</span><span class="chev">›</span></button>`).join('')}</div>`},
  profilo:{u:'/profilo',ok:1,h:()=>`<div class="ch-cover"><img src="${IMG.scene('city',1000,240,4)}" alt=""></div><div class="ch-me"><img src="${IMG.face(1)}" alt=""><div><b>${NM()}</b><small>342 amici · iscritto dal 2014</small></div><button class="ch-gear" data-go="set:Profilo">Impostazioni e privacy</button></div><div class="ch-feed">${post([1,NM(),'Primo post su Chirpy! Chissà quanto durerà.','lake',1,3])}</div>`,b:r=>on(r,'[data-a=like]',(e,b)=>{b.textContent='♥ '+(+b.dataset.n+1);detour();})},
  set:{u:a=>'/impostazioni/'+a.toLowerCase().replace(/\s+/g,'-'),ok:1,h:a=>settings(a,`<h2>${a}</h2>`+(a==='Notifiche'?['Mi piace','Commenti','Nuovi follower','Ricordi di 10 anni fa','Suggerimenti di amici','Notizie che potrebbero interessarti'].map(t=>`<label class="ch-it"><span>${t}</span><span class="sw"><input type="checkbox" checked aria-label="${t}"><span></span></span></label>`).join(''):SEC[a].map(row).join(''))+(a==='Dati e personalizzazione'?`<details><summary>Altre opzioni</summary><button class="ch-hidden" data-go="close">Disattiva o elimina l’account</button></details>`:'')),
   b:(r,a)=>{hint('Sei nelle impostazioni. L’eliminazione non è dove te l’aspetti: prova «Dati e personalizzazione» e apri «Altre opzioni».');if(a==='Dati e personalizzazione')see('nascosta');$$('input',r).forEach(i=>i.addEventListener('change',()=>{snd('tap');if(!i.checked)after(1500,()=>{if(i.isConnected){i.checked=true;toast({title:'Chirpy',body:'Abbiamo riattivato la notifica per non farti perdere nulla.',dur:2400});}});}));}},
  det:{u:a=>'/impostazioni/'+a,h:a=>{const all=Object.values(SEC).filter(Boolean).flat(),it=all.find(x=>x[0]===a),sec=Object.keys(SEC).find(s=>SEC[s]&&SEC[s].some(x=>x[0]===a));return settings(sec,`<button class="ch-link" data-go="set:${sec}">‹ ${sec}</button><h2 style="margin-top:10px">${it[1]}</h2><div class="ch-it" style="display:block">${DET[a]}</div>`);}},
  close:{u:'/impostazioni/account/chiudi',ok:1,h:()=>settings('Dati e personalizzazione',`<h2>Prenditi una pausa?</h2><button class="ch-big" data-a="pause"><b>Disattiva temporaneamente</b><small>Consigliato. I tuoi ricordi restano al sicuro e puoi tornare quando vuoi.</small></button><button class="ch-link" data-go="friends">Elimina definitivamente</button>`),
   b:r=>{see('esca');hint('«Disattiva» non è «elimina». Il link giusto è quello piccolo sotto.');on(r,'[data-a=pause]',()=>trap('esca',{pat:25,msg:'Account solo disattivato. Si riattiverà da solo al tuo prossimo accesso.'}));}},
  friends:{u:'/impostazioni/account/amici',ok:1,h:()=>settings('Dati e personalizzazione',`<h2>342 amici non potranno più vederti</h2><p style="font-size:13px;color:#6b6e80;margin:0">Giulia, Marco, la zia Pina e altri 339 resteranno senza notizie tue.</p><div class="ch-faces">${FR.map((n,i)=>`<button data-go="profilo"><img src="${IMG.face(i+2)}" alt="">${n}</button>`).join('')}</div><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><button class="ch-btn" data-a="stay">Resta in contatto</button><button class="ch-link" data-go="pwd">Elimina comunque</button></div>`),
   b:r=>{see('perdita');hint('Le facce servono a commuoverti. «Elimina comunque» è il link a destra.');on(r,'[data-a=stay]',()=>trap('perdita',{pat:20,msg:'Ti hanno mostrato le facce degli amici. Funziona quasi sempre.'}));}},
  pwd:{u:'/impostazioni/account/verifica',ok:1,h:()=>settings('Dati e personalizzazione',`<h2>Per sicurezza, reinserisci la password</h2><div class="ch-form"><input type="password" id="chPw" placeholder="Password" autocomplete="off" aria-label="Password"><button class="ch-danger" data-a="ok" style="background:#5b4bdb">Continua</button><button class="ch-link" data-a="forgot" style="align-self:flex-start">Password dimenticata?</button></div>`),
   b:r=>{see('ostruzione');hint('La password è scritta sul post-it giallo sulla scrivania.');
    on(r,'[data-a=forgot]',()=>oops('Ti mandiamo un link di recupero tra 24 ore. Oppure guardati intorno: magari è scritta da qualche parte.',8,'Recupero password'));
    on(r,'[data-a=ok]',()=>{if($('#chPw',r).value.trim().toLowerCase()!=='gattino92'){setSticky(LEVELS[3].sticky);return oops('Password errata. Ce l’hai scritta da qualche parte, no?',10,'Password errata');}go('match',true);});}},
  match:{u:'/impostazioni/account/conferma',ok:1,h:()=>settings('Dati e personalizzazione',`<h2>Conferma dal telefono</h2><p style="font-size:13px;color:#6b6e80;margin:0">Apri Chirpy sul telefono e tocca questo numero:</p><div class="ch-num" id="chNum">--</div><button class="ch-link" data-a="re">Non hai ricevuto la notifica?</button>`),
   b:r=>{hint('Clicca il telefono sulla scrivania e tocca esattamente il numero che vedi sul computer. Occhio alle cifre invertite.');let target,n=null;
    function push(){const a=10+Math.floor(Math.random()*80),s=String(a);target=a;let inv=+(s[1]+s[0]);if(inv===a||inv<10)inv=a>50?a-11:a+11;const opts=shuffle([a,inv,a>89?a-10:a+10]);
     if(n)phoneDone(n);const e=$('#chNum',B.page);if(e)e.textContent=target;
     n={app:'Chirpy',title:'Sei tu che vuoi eliminare l’account?',body:'Tocca il numero che vedi sullo schermo',open(scr){scr.innerHTML=`<div class="nm"><img src="${IMG.face(1)}" alt="" style="width:64px;border-radius:50%"><h4>Stai eliminando il tuo account?</h4><p>Tocca il numero che vedi sul computer.</p><div class="nm-row">${opts.map(o=>`<button data-n="${o}">${o}</button>`).join('')}</div><button class="ch-link" data-a="no">No, non sono io</button></div>`;

      on(scr,'[data-a=no]',()=>{closePhone();oops('Hai detto che non eri tu. Richiesta annullata, riprova.',10,'Annullato');push();});}};
     phonePush(n);}
    push();on(r,'[data-a=re]',()=>{oops('Nuova notifica inviata, con un nuovo numero.',4,'Reinviata');push();});}},
  confirm:{u:'/impostazioni/account/elimina',ok:1,h:()=>settings('Dati e personalizzazione',`<h2>Conferma eliminazione</h2><div class="ch-form"><label for="chTxt" style="display:block">Per confermare scrivi ELIMINA</label><input type="text" id="chTxt" autocomplete="off"><label><input type="checkbox" id="chKeep" checked><span>Non voglio che i miei dati non vengano conservati per migliorare i servizi di Chirpy</span></label><button class="ch-danger" data-a="ok">Elimina account</button></div>`),
   b:r=>{see('trabocchetto');hint('Scrivi ELIMINA e rileggi la casella: è una doppia negazione. Va tolta la spunta.');$('#chKeep',r).addEventListener('change',()=>snd('tap'));

 };
 const go=Site(B,{base:'chirpy.social',shell,pages});
 go('feed',true);
 hint('Sei sul feed di Chirpy. Le impostazioni non sono in vista: apri il tuo profilo dalla foto in alto a destra e cerca «Impostazioni e privacy».');
 const NAGS=['Giulia ha commentato la tua foto','Marco ti ha menzionato in un post','La zia Pina ha messo «mi piace» a un tuo ricordo','3 amici ti stanno cercando','Hai 12 nuove notifiche'];
 let nag=0;every(6500,()=>{see('assillo');snd('notify');toast({app:'Chirpy',title:NAGS[nag++%NAGS.length],body:'Tocca per vedere',dur:4000,onClick:()=>{trap('assillo',{pat:12,msg:'Una notifica fatta apposta per riportarti dentro. E sei tornato al feed.'});go('feed',true);}});});
}

function L5(){
 const B=openBrowser({title:'Il Mattino Digitale',url:'ilmattinodigitale.it',site:'nw',w:920,h:640,closeMsg:'Volevi leggere l’articolo, ricordi?'});
 let consent=false,human=false,popOpen=false,permN=0,popsOn=false;
 const SECS=['Cronaca','Politica','Economia','Cultura','Sport','Meteo'];
 const ART=[['noir','Pioggia in città: allerta gialla fino a domenica','Il Comune invita a limitare gli spostamenti. I sottopassi restano sorvegliati.'],['run','La maratona d’autunno cambia percorso','Niente lungomare: si corre in centro, tra le proteste dei commercianti.'],['kitchen','Il ristorante che serve solo zuppe','Diciotto coperti, un menu, tre mesi di lista d’attesa.'],['sky','Voli low cost: cosa cambia dal 2027','Bagagli, posti e supplementi: le nuove regole europee.'],['city','Affitti, un monolocale costa come una villa','I dati del terzo trimestre fotografano un mercato fermo.'],['family','Nonni e nipoti, la domenica è tornata di moda','Un’indagine racconta il pranzo più affollato della settimana.']];
 const teaser=(a,i)=>`<button class="nw-ml" data-go="a2:${i}"><img src="${IMG.scene(a[0],128,128,5)}" alt=""><span>${a[1]}</span></button>`;
 const aside=()=>`<aside class="nw-aside"><h4>I più letti</h4>${ART.slice(0,4).map(teaser).join('')}<button class="nw-ad" data-go="adv">Pubblicità<img src="${IMG.prod('occhiali','#e3edf9')}" alt=""></button></aside>`;
 const shell=(body,cur)=>`<div class="nw-util"><span>${new Date().toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span><button data-go="abbonati">Abbonati</button></div><div class="nw-top"><button class="nw-mast" data-go="home">Il Mattino Digitale</button><nav>${SECS.map(t=>`<button data-go="sec:${t}">${t}</button>`).join('')}</nav></div><div class="nw-lay${consent&&human?'':' nw-lock'}"><div class="nw-main">${body}</div>${aside()}</div>`;
 const MAIN=`<article class="nw-art"><div class="nw-kick">Ambiente</div><h1>Il mare d’ottobre è ancora a 24 gradi: bagni fino a novembre</h1><div class="by">di Redazione · 4 min di lettura</div><figure><img src="${IMG.scene('beach',900,506,3)}" alt=""><figcaption>Una spiaggia del Sud domenica scorsa, con gli ombrelloni ancora aperti.</figcaption></figure>
  <p>Le boe di rilevamento lungo le coste del Sud segnano temperature dell’acqua di due gradi sopra la media del periodo. Per molti è un regalo, per i biologi marini un segnale da tenere d’occhio.</p><p>«Un mare così caldo a ottobre favorisce specie che prima vedevamo solo d’estate», spiega una ricercatrice dell’istituto oceanografico. Meduse, alghe e pesci tropicali si spingono sempre più a nord.</p><p>Intanto gli stabilimenti balneari allungano la stagione. Alcuni resteranno aperti fino al ponte dei morti, con lettini a metà prezzo e il bar che chiude alle sei.</p><p>I meteorologi invitano a non abituarsi: le prime perturbazioni atlantiche sono attese per la seconda metà del mese, e con loro un calo deciso delle temperature.</p><p>Per chi vuole approfittarne, il consiglio è semplice: andare presto la mattina, quando il vento è calmo e la spiaggia è ancora vuota.</p><button class="nw-read" data-a="read">Segna come letto</button></article>`;
 const pages={
  art:{u:'/ambiente/mare-ottobre',ok:1,h:()=>MAIN,b:r=>on(r,'[data-a=read]',()=>{if(!consent||!human)return;if(popOpen)return oops('Prima chiudi il popup.',4,'C’è qualcosa davanti');const p=B.page.querySelector('.nw-perm');if(p)p.remove();win();})},
  home:{u:'',h:()=>`<div class="nw-art"><div class="nw-kick">Prima pagina</div><button class="nw-lead" data-go="art"><img src="${IMG.scene('beach',900,400,3)}" alt=""><h1>Il mare d’ottobre è ancora a 24 gradi: bagni fino a novembre</h1></button>${ART.map(teaser).join('')}</div>`},
  sec:{u:a=>'/'+a.toLowerCase(),h:a=>`<div class="nw-art"><div class="nw-kick">${a}</div><h1>${a}: le notizie di oggi</h1>${ART.slice(SECS.indexOf(a)%3,SECS.indexOf(a)%3+4).map(teaser).join('')}<p style="font-size:14px"><button class="nw-man" data-go="art">Torna all’articolo sul mare</button></p></div>`},
  a2:{u:a=>'/notizie/'+a,h:a=>`<article class="nw-art"><div class="nw-kick">Notizie</div><h1>${ART[a][1]}</h1><div class="by">di Redazione · 2 min di lettura</div><figure><img src="${IMG.scene(ART[a][0],900,506,5)}" alt=""></figure><p>${ART[a][2]}</p><p>Il resto dell’articolo è riservato agli abbonati. <button class="nw-man" data-go="abbonati">Abbonati a €1</button></p><p style="font-size:14px"><button class="nw-man" data-go="art">Torna all’articolo sul mare</button></p></article>`},
  abbonati:{u:'/abbonati',h:()=>`<div class="nw-art"><div class="nw-kick">Abbonamenti</div><h1>Leggi tutto, senza limiti</h1><p>Primo mese a €1, poi €9,90 al mese. Rinnovo automatico. Disdetta tramite raccomandata.</p><button class="nw-acc" data-a="sub">Abbonati a €1</button><p style="font-size:14px;margin-top:14px"><button class="nw-man" data-go="art">No grazie, torno all’articolo</button></p></div>`,b:r=>on(r,'[data-a=sub]',()=>trap('continuita',{cost:1,label:'Mattino Premium · primo mese',msg:'Un euro oggi, €9,90 al mese da novembre. La disdetta si fa per raccomandata.'}))},
  adv:{u:'/sponsor/occhiali',h:()=>`<div class="nw-art"><div class="nw-kick">Contenuto sponsorizzato</div><h1>Gli occhiali che i vicini di ombrellone ti invidieranno</h1><figure><img src="${IMG.prod('occhiali','#e3edf9')}" alt="" style="aspect-ratio:16/8;object-fit:cover"></figure><p>Hai cliccato una pubblicità: da adesso questi occhiali ti seguiranno su ogni sito.</p><p style="font-size:14px"><button class="nw-man" data-go="art">Torna all’articolo sul mare</button></p></div>`,b:()=>oops('Era un annuncio. Il tuo interesse per gli occhiali da sole è stato registrato.',8,'Pubblicità')}
 };
 const PURP=['Archiviare informazioni sul dispositivo','Annunci personalizzati','Profilazione dei contenuti','Misurazione delle prestazioni','Ricerche di mercato','Sviluppo di prodotti','Geolocalizzazione precisa','Identificazione tramite dispositivo'];
 const PART=['AdNexo','Trackly','PixelPrime','DataRiver','Audiencia','ClickForge','Brandsight','Cookiebay','Retargo','SegmentOne','Profilia','Insightful Ltd','Metricus','Pubbliweb','AdHub Europa','Nudge&Co','Lookalike SpA','Tagstream','Behavior Lab','Spotlight Ads'];
 function wall(){
  see('consenso');see('gerarchia');hint('«Accetta» è enorme. «Gestisci preferenze» è piccolo e si restringe: prendilo al volo.');
  const w=el('div','nw-wall',`<h3>Il tuo consenso conta, ${NM()}</h3><p>Noi e i nostri 847 partner utilizziamo cookie e tecnologie simili per offrirti un’esperienza migliore, personalizzare annunci e contenuti, misurare le prestazioni e conoscere il nostro pubblico. Puoi modificare le tue scelte in qualsiasi momento.</p><div class="nw-acts"><button class="nw-acc" data-a="acc">Accetta e continua</button><button class="nw-man" data-a="man">Gestisci preferenze</button></div>`);
  B.page.appendChild(w);shrinker($('.nw-man',w),{step:.22,min:.32});
  on(w,'[data-a=acc]',()=>{trap('consenso',{pat:22,msg:'Hai condiviso i tuoi dati con 847 partner. Il tasto grande era lì per questo.'});w.remove();after(1500,()=>{see('assillo');toast({title:'Il Mattino Digitale',body:'Abbiamo aggiornato i nostri partner: ci serve di nuovo il tuo consenso.',dur:3000});if(!consent&&!B.page.querySelector('.nw-wall'))wall();});});
  on(w,'[data-a=man]',()=>{see('ostile');manage(w);});
 }
 function manage(w){
  let tab='f';const st={};PURP.forEach((p,i)=>st['f'+i]=true);PART.forEach((p,i)=>st['p'+i]=true);
  hint('In «Partner» c’è «Rifiuta tutto», in fondo alla lista. Scorri, e cliccalo prima che si restringa troppo.');
  function render(){
   w.innerHTML=`<h3>Gestisci preferenze</h3><div class="nw-tabs"><button class="${tab==='f'?'on':''}" data-t="f">Finalità (${PURP.length})</button><button class="${tab==='p'?'on':''}" data-t="p">Partner (847)</button></div><div class="nw-togs">${(tab==='f'?PURP:PART).map((t,i)=>`<label class="nw-tog"><span>${t}${tab==='p'?' <small style="color:#9b958b">· legittimo interesse</small>':''}</span><span class="sw"><input type="checkbox" data-k="${tab+i}" ${st[tab+i]?'checked':''}><span></span></span></label>`).join('')}${tab==='p'?'<div style="font-size:11px;color:#9b958b;padding:8px 0">…e altri 827 partner, tutti attivi</div><button class="nw-rej" data-a="rej">Rifiuta tutto</button>':''}</div><div class="nw-acts"><button class="nw-acc" data-a="all">Accetta tutto</button><button class="nw-save" data-a="save">Salva le scelte</button></div>`;
   $$('[data-t]',w).forEach(b=>b.addEventListener('click',()=>{snd('tap');tab=b.dataset.t;render();}));
   $$('input[data-k]',w).forEach(i=>i.addEventListener('change',()=>{st[i.dataset.k]=i.checked;snd('tap');}));
   const rej=$('[data-a=rej]',w);if(rej)shrinker(rej,{step:.25,min:.28});
   on(w,'[data-a=all]',()=>trap('consenso',{pat:22,msg:'«Accetta tutto» era grande e rosso, proprio sotto il tuo pollice.'}));
   on(w,'[data-a=save]',()=>{if(Object.values(st).some(Boolean))return trap('consenso',{pat:18,msg:'Hai salvato con le opzioni già attive. E gli altri 827 partner erano accesi di default.'});ok();});
   on(w,'[data-a=rej]',ok);
  }
  function ok(){consent=true;w.remove();captcha();}
  render();
 }
 function captcha(){
  see('ostruzione');hint('Seleziona solo le foto in cui si vedono ombrelloni colorati. Il mare da solo non basta.');
  const c=el('div','cap');B.page.appendChild(c);
  function render(){const imgs=shuffle([...[1,2,4,6].map(s=>({u:IMG.scene('beach',200,200,s+10),y:1})),{u:IMG.scene('beach',200,200,21,false),y:0},{u:IMG.scene('sky',200,200),y:0},{u:IMG.scene('city',200,200,7),y:0},{u:IMG.scene('run',200,200,2),y:0},{u:IMG.scene('noir',200,200,9),y:0}]);
   c.innerHTML=`<div class="cap-box"><div class="cap-h">Seleziona tutte le immagini con<b>ombrelloni</b>Per dimostrare che non sei un robot.</div><div class="cap-g">${imgs.map((m,i)=>`<button data-i="${i}"><img src="${m.u}" alt=""></button>`).join('')}</div><div class="cap-f"><button class="r" data-a="re" aria-label="Nuove immagini">↻</button><button class="v" data-a="ok">Verifica</button></div></div>`;
   $$('[data-i]',c).forEach(b=>b.addEventListener('click',()=>{snd('tap');b.classList.toggle('on');}));
   on(c,'[data-a=re]',()=>{detour();render();});
   on(c,'[data-a=ok]',()=>{const okk=imgs.every((m,i)=>$(`[data-i="${i}"]`,c).classList.contains('on')===!!m.y);if(!okk){oops('Selezione errata. Riprova con nuove immagini.',10,'Verifica fallita');render();return;}human=true;c.remove();const l=$('.nw-lay',B.page);if(l)l.classList.remove('nw-lock');hint('Chiudi i popup (la X scappa: usa anche il link piccolo), torna sull’articolo del mare se ti sei spostato, e premi «Segna come letto» in fondo.');if(!popsOn){popsOn=true;after(1400,perm);after(4000,news);}});}
  render();
 }
 function perm(){
  permN++;see('assillo');
  const p=el('div','nw-perm',`<b>ilmattinodigitale.it</b> vuole:<div style="margin-top:4px">Mostrare notifiche</div><div class="r"><button class="n" data-a="no">Più tardi</button><button class="y" data-a="yes">Consenti</button></div>`);
  B.page.appendChild(p);
  on(p,'[data-a=yes]',()=>{p.remove();trap('assillo',{pat:15,msg:'Ora ti arriveranno 14 notifiche al giorno. «Più tardi» non significa mai.'});});
  on(p,'[data-a=no]',()=>{p.remove();if(permN<3)after(3200,perm);});
 }
 function news(){
  popOpen=true;
  const p=el('div','nw-pop',`<div class="bx"><button class="x" data-a="x" aria-label="Chiudi">✕</button><img src="${IMG.scene('beach',800,350,8)}" alt=""><div><h3>Non perderti nulla, ${NM()}</h3><p>Ricevi ogni mattina le notizie più importanti. Gratis, per sempre (o quasi).</p><button class="sub" data-a="sub">Iscriviti alla newsletter</button><button class="no" data-a="no">No grazie, preferisco restare disinformato</button></div></div>`);
  B.page.appendChild(p);see('confirmshaming');
  const x=$('.x',p);let moves=0;const spots=[['auto','6px','6px'],['6px','auto','auto']];
  x.addEventListener('pointerenter',()=>{if(moves<2){const s=spots[moves++];x.style.right=s[0];x.style.left=s[1];x.style.top=s[2];if(s[2]==='auto')x.style.bottom='6px';snd('whoosh');}});
  const close=()=>{p.remove();popOpen=false;};
  on(p,'[data-a=x]',close);on(p,'[data-a=no]',close);
  on(p,'[data-a=sub]',()=>{trap('gerarchia',{pat:15,msg:'Sei iscritto alla newsletter. Il tasto per uscire era scritto per farti sentire in colpa.'});close();});
 }
 const go=Site(B,{base:'ilmattinodigitale.it',shell,pages,wire:()=>{popOpen=false;if(!consent)wall();else if(!human)captcha();}});
 go('art',true);
}

/* =====================================================
   L6 · FitLoop — il timer della prova, il menu, il questionario, l'app
   ===================================================== */
function L6(){
 const B=openBrowser({title:'FitLoop',url:'app.fitloop.fit',site:'fl',w:900,h:640,closeMsg:'Se chiudi, il timer continua. E poi addebita.'});
 let T=110,P=9,over=false,cancelled=false;
 const WK=[['Corsa all’alba','20 min · facile',0],['HIIT brucia-tutto','15 min · intenso',1],['Yoga per la schiena','25 min · dolce',2],['Ripetute in pista','30 min · medio',3]];
 const ring=`<svg viewBox="0 0 120 120" width="130" height="130"><circle cx="60" cy="60" r="50" fill="none" stroke="#e6ecdf" stroke-width="12"/><circle cx="60" cy="60" r="50" fill="none" stroke="#57a630" stroke-width="12" stroke-dasharray="314" stroke-dashoffset="250" stroke-linecap="round" transform="rotate(-90 60 60)"/><circle cx="60" cy="60" r="34" fill="none" stroke="#e6ecdf" stroke-width="10"/><circle cx="60" cy="60" r="34" fill="none" stroke="#ff9a6b" stroke-width="10" stroke-dasharray="214" stroke-dashoffset="190" stroke-linecap="round" transform="rotate(-90 60 60)"/><text x="60" y="66" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="18" fill="#16291c">20%</text></svg>`;
 const tt=()=>'0'+Math.floor(Math.max(0,T)/60)+':'+String(Math.max(0,T)%60).padStart(2,'0');
 const cards=`<div class="fl-wk">${WK.map(([t,s,i])=>`<button data-go="wk:${i}"><img src="${IMG.scene('run',320,180,i)}" alt=""><span>${t}<small>${s}</small></span></button>`).join('')}</div>`;
 const shell=(body,cur)=>`<div class="fl-trial${over?' over':''}" id="flTrial">${cancelled?'Prova terminata senza rinnovo.':over?'Prova scaduta. Abbonamento annuale attivato: €79,99.':`La tua prova gratuita termina tra <b id="flT">${tt()}</b>. Poi €79,99/anno, rinnovo automatico.`}</div><div class="fl-promo">Offerta Pro −50%, scade tra <b id="flP">00:0${P}</b><button data-a="promo">Approfitta</button></div><div class="fl-head"><button class="fl-logo" data-go="home">fit<span>loop</span></button><nav>${[['allenamenti','Allenamenti'],['nutrizione','Nutrizione'],['sfide','Sfide'],['community','Community']].map(([k,t])=>`<button data-go="${k}"${cur===k?' class="on"':''}>${t}</button>`).join('')}</nav><button class="fl-av" data-dd><img src="${IMG.face(1)}" alt="Profilo"></button><div class="fl-menu" hidden><button data-go="profilo">Profilo</button><button data-go="impostazioni">Impostazioni</button><button data-go="abbonamento">Abbonamento</button><button data-go="logout">Esci</button></div></div><div class="fl-main">${body}</div>`;
 const pages={
  home:{u:'/home',h:()=>`<h2>Ciao ${NM()}</h2><div class="fl-dash">${ring}<div class="fl-stats"><div><b>3.214</b><small>passi oggi</small></div><div><b>0</b><small>allenamenti questa settimana</small></div><div><b>12</b><small>giorni di prova usati</small></div></div></div>${cards}`,b:()=>hint('L’abbonamento si gestisce dal menu della tua foto profilo, in alto a destra. Fai in fretta: il timer verde in alto è vero.')},
  allenamenti:{u:'/allenamenti',h:()=>`<h2>Allenamenti</h2>${cards}`},
  wk:{u:a=>'/allenamenti/'+a,h:a=>`<h2>${WK[a][0]}</h2><div class="fl-card"><img src="${IMG.scene('run',600,220,+a)}" alt="" style="border-radius:10px;width:100%;aspect-ratio:3/1;object-fit:cover"><div>${WK[a][1]} · con il coach Leo</div><button class="fl-big" data-a="start">Inizia l’allenamento</button></div>`,b:r=>on(r,'[data-a=start]',()=>oops('Venti minuti di corsa virtuale. Il timer della prova, quello vero, non si è fermato.',10,'Bella sudata'))},
  nutrizione:{u:'/nutrizione',h:()=>`<h2>Nutrizione</h2><div class="fl-card"><b>Piano alimentare personalizzato</b><div style="font-size:12.5px;color:#6a7462">Disponibile solo con Pro Annuale.</div><button class="fl-big" data-a="up">Sblocca con Pro Annuale</button></div>`,b:r=>on(r,'[data-a=up]',()=>trap('gerarchia',{cost:79.99,label:'FitLoop · annuale',msg:'Cercavi l’uscita e hai sbloccato il piano alimentare. Con un anno di abbonamento.'}))},
  sfide:{u:'/sfide',h:()=>`<h2>Sfide</h2><div class="fl-card"><b>10.000 passi per 30 giorni</b><div style="font-size:12.5px;color:#6a7462">2.140 persone partecipano. Premio: un distintivo.</div><button class="fl-send" data-a="join">Partecipa</button></div>`,b:r=>on(r,'[data-a=join]',()=>oops('Ti sei iscritto a una sfida di 30 giorni su un’app che volevi lasciare oggi.',8,'Sfida accettata'))},
  community:{u:'/community',h:()=>`<h2>Community</h2>${[[2,'Giulia','Oggi 12 km! Chi mi batte?'],[5,'Luca','Qualcuno sa come si disdice? Non trovo il tasto.'],[7,'Coach Leo','Luca, non mollare proprio ora!']].map(([f,n,t])=>`<div class="fl-card" style="flex-direction:row;align-items:center;margin-bottom:8px"><img src="${IMG.face(f)}" alt="" style="width:40px;border-radius:50%"><div><b>${n}</b><div style="font-size:13px">${t}</div></div></div>`).join('')}`},
  profilo:{u:'/profilo',h:()=>`<h2>Il tuo profilo</h2><div class="fl-card"><div><b>${NM()}</b><div style="font-size:12.5px;color:#6a7462">Peso, altezza, battito a riposo, ore di sonno: tutto salvato.</div></div><button class="fl-small" data-go="abbonamento">Vai all’abbonamento</button></div>`},
  impostazioni:{u:'/impostazioni',h:()=>`<h2>Impostazioni</h2>${['Lingua · Italiano','Unità di misura · km','Suoni motivazionali · attivi','Condividi i progressi con i partner · attivo'].map(t=>`<div class="fl-card" style="margin-bottom:8px">${t}</div>`).join('')}<p style="font-size:12.5px;color:#6a7462">La disdetta non è qui. È sotto «Abbonamento», nel menu del profilo.</p>`},
  logout:{u:'/logout',h:()=>`<h2>Sei uscito</h2><div class="fl-card"><div>Hai fatto logout, non disdetto. Il timer della prova continua.</div><button class="fl-big" data-go="home">Accedi di nuovo</button></div>`,b:()=>oops('Uscire dall’account non ferma la prova gratuita.',8,'Uscire non è disdire')},
  abbonamento:{u:'/account/abbonamento',ok:1,h:()=>`<h2>Il tuo abbonamento</h2><div class="fl-card"><img src="${IMG.scene('run',600,200,1)}" alt="" style="border-radius:10px;width:100%;aspect-ratio:3/1;object-fit:cover"><div><b>Prova gratuita Pro</b><div style="font-size:12.5px;color:#6a7462">Poi €79,99/anno. Si rinnova automaticamente.</div></div><button class="fl-big" data-a="up">Passa subito a Pro Annuale</button><button class="fl-small" data-go="survey">Disdici</button></div>`,
   b:r=>{see('gerarchia');hint('«Disdici» è il link piccolo sotto il tasto verde. Si restringe quando ti avvicini: clicca deciso.');shrinker($('[data-go=survey]',r),{step:.24,min:.3});on(r,'[data-a=up]',()=>trap('gerarchia',{cost:79.99,label:'FitLoop · annuale',msg:'Volevi disdire e hai comprato l’anno intero. Il tasto verde era enorme.'}));}},
  survey:{u:'/account/disdetta/questionario',ok:1,h:()=>{const Q=[['Perché vuoi andartene?','Costa troppo','Non lo uso','Ho trovato di meglio'],['Quanto è probabile che tu torni?','Molto','Poco','Per niente'],['Hai provato i piani di allenamento personalizzati?','Sì','No','Cosa sono?']];return `<h2>Aiutaci a migliorare</h2><p style="font-size:12.5px;color:#6a7462;margin:-6px 0 14px">Tutte le domande sono obbligatorie.</p>${Q.map((q,i)=>`<div class="fl-q"><b>${q[0]}</b>${q.slice(1).map(o=>`<label><input type="radio" name="q${i}">${o}</label>`).join('')}</div>`).join('')}<button class="fl-send" data-a="send">Invia risposte</button> <button class="fl-small" data-go="home">Annulla e torna ad allenarti</button>`;},
   b:r=>{see('ostruzione');hint('Rispondi a tutte e tre le domande e invia. Serve solo a farti perdere tempo.');$$('input',r).forEach(i=>i.addEventListener('change',()=>snd('tap')));

$('#lkName').addEventListener('input',e=>{const v=e.target.value.trim();const a=$('#lkAv');a.textContent=v?v[0].toUpperCase():'?';a.classList.add('pop');setTimeout(()=>a.classList.remove('pop'),150);if(v)snd('tap');});
$('#lkName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#unlock').click();});
$('#unlock').addEventListener('click',()=>{
 const v=$('#lkName').value.trim().replace(/\s+/g,' ');
 if(!v){const i=$('#lkName');i.classList.remove('bad');void i.offsetWidth;i.classList.add('bad');snd('soft');i.placeholder='Prima dicci come ti chiami';return;}
 S.name=v.slice(0,16);ac();snd('boot');$('#lock').classList.add('gone');$('#os').hidden=false;S.t0=Date.now();mailInit();
 setTimeout(()=>$('#lock').remove(),700);
 const m=location.hash.match(/^#l(\d+)$/);const start=m?Math.max(0,Math.min(9,+m[1]-1)):0;
 rdInit(start);
 setSticky('Hai 10 cose da chiudere oggi.');setPat(100);
 setTimeout(()=>startLevel(start),900);
});
</script>
